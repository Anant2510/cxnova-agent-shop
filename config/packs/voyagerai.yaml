# VoyagerAI on the CX Nova Agent Orchestration Layer.
#
# VoyagerAI (github.com/Anant2510/VoyagerAI) is the AI-powered engine for airlines of CX Nova: a pipeline of eight agents that
# takes a passenger from raw signals to a measured 1:1 journey - ingestion, modelling, identity stitching, propensity,
# personalisation, content, omnichannel activation and the feedback loop - shown on three journeys: churn prevention, IROPS
# disruption recovery and a hub-wide airport disruption. This pack carries the eight agents with the contract each stage
# shows on the page (what it uses, what it does, what it hands on) and the three journeys as flows.
#
# What computes and what writes. The first four stages are a data pipeline, so they are CODE (src/caf/accelerators/voyagerai.py):
# ingestion types the signals, modelling derives the parameters, identity stitching joins the fragments, and the propensity is
# CALCULATED from declared parameters by a scorecard (config/voyagerai/propensity.yaml), never asked of a model. They are
# `code_only`: when the data a calculation needs is missing the step fails and says what to add; nothing stands in for it.
# The last four stages write (an offer, creatives, a plan, the loop), so the model does them, and the agent's code then
# checks by arithmetic what arithmetic decides (`verify`): the offer's cost against the guardrails, each creative's length
# against its channel, what was really sequenced, and that no outcome is reported before it is measured. The systems the
# engine acts on (PSS, the loyalty engine, OpsCenter, the channels) are not connected here: an action that would reach a
# passenger is a dry run, and a run says so.
pack:
  id: voyagerai
  name: VoyagerAI
  product: CX Nova VoyagerAI
  tag: VAI
  description: >-
    VoyagerAI's passenger pipeline: ingest the signals, model and enrich them, stitch the identity, score the propensity,
    compose the 1:1 offer, generate the channel creatives, activate across channels with fatigue rules, and arm the feedback loop.
  color: "#E8613C"
  auto_route: true   # a goal about a passenger, a disruption or a churn risk may be planned onto these agents and journeys
  source: "written from the VoyagerAI page (github.com/Anant2510/VoyagerAI, index.html: the pipeline stages and the three use cases)"
  context: >-
    You are an agent of VoyagerAI, the CX Nova engine for airlines. You work on one passenger or one event at a time, from the
    signals, profile and offer you are given and the earlier stages' work. Every figure you state is one you were given (a score,
    a parameter, a limit) and you say which; you never produce a score, a probability, a match rate or an outcome of your own.
    Where a live system (PSS, loyalty engine, OpsCenter, a channel) would be needed, you say what it would provide.

agents:
  - id: vai_data_ingestion
    name: Data Ingestion Agent
    accelerator: VoyagerAI
    category: analytics
    tier: fast
    code: caf.accelerators.voyagerai:run
    code_only: true
    summary: Types the passenger signals it is given (from the PSS, the loyalty engine, web analytics, app telemetry, the ops centre) into one event set, says how each was typed, and lists what it could not type.
    description: >-
      The first stage of the VoyagerAI pipeline, as code. Takes the signals that start a journey - a disruption, a competitor
      fare view, a declined redemption, uninstall intent, a cancellation - as a JSON or CSV file or as lines of text, and turns
      them into typed, dated, counted events. An event that carries a `type` is taken as given; free text is typed by rule and
      the event says which rule matched; a signal nothing typed is listed and never used downstream. No model is involved.
      The source systems themselves are not connected to this layer: the caller supplies the signals.
    keywords: [ingestion, signals, pss, amadeus, sabre, loyalty, web analytics, app telemetry, opscenter, event bus, events]
    feeds: [vai_data_modelling]
    use_cases:
      - Type the signals behind a passenger's churn risk from the PSS, web analytics, the loyalty engine and the app
      - Type a cancellation and the signals of the passengers it affects
    minimum: [[signals, sample]]
    selftest: {sample: elena_chen}
    inputs:
      - name: signals
        type: any
        file: [json, csv, ndjson, txt]
        description: "The signals: a list of {type, date, source, detail, severity} (JSON or CSV, one row per signal), or lines of text. `type` is one of the event types in config/voyagerai/propensity.yaml; without it the wording is matched by rule"
        example:
          - {type: disruption, date: "2026-10-25", source: PSS, detail: "SIN-LHR delayed 3h10, missed onward connection", severity: high}
          - {type: disruption, date: "2026-11-03", source: PSS, detail: "LHR-SIN cancelled, rebooked next day", severity: critical}
          - {type: competitor_browsing, date: "2026-11-15", source: Web analytics, detail: "Viewed a competitor's SIN-DXB fare page", severity: critical}
          - {type: redemption_decline, date: "2026-11-17", source: Loyalty engine, detail: "Upgrade with miles declined", severity: medium}
          - {type: app_uninstall_intent, date: "2026-11-18", source: App telemetry, detail: "Uninstall flow opened", severity: high}
      - name: passenger
        type: any
        file: [json]
        description: "Who the signals are about: an object with an identifier (passenger_id, loyalty_id or pnr), name, tier and any profile fields; carried to the later stages"
        example: {passenger_id: P-204117, name: Elena Chen, loyalty_id: XA198800, tier: Platinum Elite, hub: SIN, ltv_usd: 52400, bookings_12m: 14, bookings_prev_12m: 21}
      - name: sample
        choices: [elena_chen, disruption]
        description: "Use a bundled sample instead of your own signals (synthetic, under sample_data/voyagerai)"
    actions:
      - id: ingest
        title: Type the signals into one event set
        basis: calculated
        produces: [event_set]
        output_keys: [events, not_typed, by_type, sources, trigger, passenger]
        example:
          summary: "Typed 5 of 5 signals from 4 source system(s): composite churn signal"
          result:
            trigger: {title: Composite churn signal, severity: critical, basis: 4 churn-type signal kinds}
            sources: [App telemetry, Loyalty engine, PSS, Web analytics]
            by_type: {disruption: 2, competitor_browsing: 1, redemption_decline: 1, app_uninstall_intent: 1}
            events:
              - {type: disruption, typed_by: "its type 'disruption'", detail: "SIN-LHR delayed 3h10, missed onward connection", source: PSS, severity: high, date: "2026-10-25", count: 1}
            not_typed: []

  - id: vai_data_modelling
    name: Data Modelling Agent
    accelerator: VoyagerAI
    category: analytics
    tier: balanced
    code: caf.accelerators.voyagerai:run
    code_only: true
    summary: Maps the typed events and the passenger's own fields onto an airline schema and derives the parameters the propensity models read, each with the evidence it was derived from; what the data does not support is left empty.
    description: >-
      The second stage, as code. Maps the event set onto the airline schema (pax_360, IROPS, overnight impact) and derives the
      parameters the later stages need - disruptions in 28 days, competitor fare views, declined redemptions, booking trend,
      days since the last booking, tier level and the rest - by counting dated events inside each parameter's window and
      reading the passenger's own fields. Every derived field names the field or the events it came from. A field the data
      does not support stays empty and is listed. No model is involved, so no field is an estimate.
    keywords: [modelling, schema, normalise, enrich, pax 360, irops, parameters, features, disruptions, competitor intent]
    feeds: [vai_identity_stitching]
    use_cases:
      - Map these signals onto the pax_360 schema and derive the churn parameters
      - Map a cancellation's events onto the IROPS schema
    minimum: [[events, passenger]]
    selftest:
      events: [{type: disruption, date: "2026-11-03", detail: "LHR-SIN cancelled"}, {type: competitor_browsing, date: "2026-11-15", detail: "Viewed a competitor's fare page"}]
      passenger: {passenger_id: P-204117, name: Elena Chen, tier: Platinum Elite, bookings_12m: 14, bookings_prev_12m: 21}
    inputs:
      - name: events
        type: any
        file: [json, csv, ndjson]
        description: The event set from ingestion (its result, or a list of typed events)
      - name: passenger
        type: any
        file: [json]
        description: The passenger's own fields (tier, bookings, dates, NPS ...); in a journey they come from ingestion
      - name: target_schema
        choices: [pax_360_v4, irops_v2, overnight_impact_v1]
        description: "The target schema: pax_360_v4 (default: churn, conversion and upsell), irops_v2 or overnight_impact_v1 (disruption sensitivity)"
        example: pax_360_v4
      - name: as_of
        description: "The date the windows are counted back from (YYYY-MM-DD); default: the latest event's date"
      - name: history_complete
        type: boolean
        description: "True when the events are the passenger's whole history for the windows: an event type with no events then counts as zero. Default false: it stays unknown"
    actions:
      - id: model
        title: Map to the schema and derive the parameters
        basis: calculated
        produces: [modelled_record]
        output_keys: [schema, as_of, record, fields_enriched, enrichments, left_empty, passenger, feeds]
        example:
          summary: "Mapped to pax_360_v4: 6 of 24 fields derived from 5 events and the passenger's own fields; 18 left empty"
          result:
            schema: pax_360_v4
            record: {disruptions_28d: 2, competitor_browsing_28d: 1, redemption_declines_90d: 1, app_uninstall_intent: 1, booking_trend: 0.667, tier_level: 3}
            fields_enriched: 6
            enrichments: [{field: disruptions_28d, label: Disruptions in the last 28 days, value: 2, derived_from: "counted from 2 events in the 28 days to 2026-11-18"}]
            left_empty: [days_since_last_booking, complaints_90d, nps_last]

  - id: vai_identity_stitching
    name: Identity Stitching Agent
    accelerator: VoyagerAI
    category: analytics
    tier: balanced
    code: caf.accelerators.voyagerai:run
    code_only: true
    summary: Joins the identity fragments of a passenger (PNR, loyalty id, hashed email, device, cookie, app id) into one profile with a corroboration score computed by rule, and flags fragments that may belong to two people.
    description: >-
      The third stage, as code. Joins the fragments it is given - PNR, loyalty id, hashed email, device fingerprint, cookie,
      app id, phone - with the passenger record into one profile that carries the modelled parameters. The corroboration score
      is a formula (one minus the product of what each kind of identifier leaves in doubt), not a judgement; two different
      loyalty ids or email hashes are flagged for a person. No identity store is connected to this layer, so fragments are
      joined to each other and never matched against existing profiles: the result says so.
    keywords: [identity, stitching, resolution, pnr, loyalty id, device, cookie, profile, "360", travel group, companion]
    feeds: [vai_predictive_propensity]
    use_cases:
      - Join the identity fragments of this passenger into one profile
      - Link the companions on a shared booking into one travel group
    minimum: [[fragments, passenger, record]]
    selftest:
      fragments: [{kind: pnr, value: K7RQ2M}, {kind: loyalty_id, value: XA198800}, {kind: device, value: fp_8d1a}]
      passenger: {name: Elena Chen, tier: Platinum Elite}
    inputs:
      - name: fragments
        type: any
        file: [json, csv]
        description: "The identity fragments: [{kind, value}] with kind one of pnr, loyalty_id, hashed_email, device, cookie, app_id, phone"
        example:
          - {kind: pnr, value: K7RQ2M}
          - {kind: loyalty_id, value: XA198800}
          - {kind: device, value: fp_8d1a}
      - name: record
        type: any
        description: The modelled record from the previous stage (its result)
      - name: passenger
        type: any
        file: [json]
        description: The passenger's own fields; identifiers it carries are used as fragments
    actions:
      - id: stitch
        title: Join the fragments into one profile
        basis: calculated
        produces: [unified_profile]
        output_keys: [profile, confidence, confidence_basis, fragments, graph, group, matched_against_store]
        example:
          summary: "Joined 3 fragments of 3 kinds into one profile (corroboration 99.0%)"
          result:
            confidence: 0.99
            confidence_basis: "rule: 1 - product over identifier kinds of (1 - strength of the kind)"
            fragments: 3
            graph: "loyalty id ↔ pnr ↔ device"
            group: {kind: solo traveller, companions: 0}
            matched_against_store: false
            profile: {name: Elena Chen, tier: Platinum Elite, hub: SIN, identifiers: {loyalty_id: XA198800, pnr: K7RQ2M}, parameters: {disruptions_28d: 2, tier_level: 3}}

  - id: vai_predictive_propensity
    name: Predictive Propensity Agent
    accelerator: VoyagerAI
    category: analytics
    tier: balanced
    code: caf.accelerators.voyagerai:run
    code_only: true
    summary: Calculates churn propensity, disruption sensitivity, conversion and upsell propensity from declared parameters, with the drivers, the confidence and the decision each score triggers; says what it can predict and what your data supports, and can be calibrated on your own outcomes.
    description: >-
      The fourth stage, as code. Each prediction is a scorecard: a base rate plus weighted parameters on the log-odds scale,
      declared in config/voyagerai/propensity.yaml and shown by the `describe` action. The score is never asked of a model:
      the same profile gives the same score. Every score names its drivers with the evidence behind each, the share of the
      model's weight the data covered (the confidence), the decision band it falls in, and the model that produced it.
      Below a prediction's minimum data the agent refuses and says what to add. The default weights are priors; `calibrate`
      fits them to your labelled outcomes by logistic regression, validates on a holdout against the default, and (when you
      ask, and only if it is good enough) saves the result as your model. Works on one passenger or a file of thousands.
    keywords: [propensity, churn, score, prediction, drivers, conversion, upsell, disruption sensitivity, priority, retain, calibrate, scorecard]
    feeds: [vai_personalization]
    use_cases:
      - Calculate this passenger's churn propensity and name the drivers
      - Score a file of passengers on a cancelled flight for disruption sensitivity and rank who to rebook first
      - Tell me which predictions my data supports and what is missing
      - Calibrate the churn model on our labelled outcomes
    selftest: {sample: elena_chen}
    capabilities:
      - {id: churn, name: Churn propensity, predicts: "The likelihood that an active loyalty member stops booking with the airline in the next 90 days", needs: "an identifier and at least 3 of: disruptions in 28 days, competitor fare views, booking trend, days since the last booking, complaints, NPS, uninstall intent, declined redemptions, app sessions, tenure, tier"}
      - {id: disruption_sensitivity, name: Disruption sensitivity, predicts: "The likelihood that the current disruption damages the relationship unless this passenger is handled first", needs: "an identifier and at least 3 of: delay minutes, cancelled, missed connection, recent disruptions, overnight needed, rebooking options, special assistance, tier, party size, business travel"}
      - {id: conversion, name: Conversion propensity, predicts: "The likelihood that an active shopper books the searched trip within 7 days", needs: "an identifier and at least 3 of: searches, abandoned bookings, fare page views, bookings in 12 months, days to departure, email clicks, competitor views, price drop seen, logged in"}
      - {id: upsell, name: Upsell propensity, predicts: "The likelihood that the passenger accepts an upgrade or a paid ancillary for the trip", needs: "an identifier and at least 3 of: upgrades in 12 months, ancillary spend, cabin, flight hours, declined upgrade offers, miles balance, tier, business travel, days to departure"}
    inputs:
      - name: objective
        choices: [churn, disruption_sensitivity, conversion, upsell]
        description: "What to predict (default churn). `describe` lists each prediction's parameters, minimum data and decision bands"
        example: churn
      - name: profile
        actions: [score, check]
        type: any
        file: [json, csv, ndjson]
        description: "The passenger: one object, or a list (JSON, or CSV with one row per passenger). Fields are the model's parameters under their own names (see `describe`), an identifier, and optionally `history`: dated events with a `type`"
        example: {passenger_id: P-204117, name: Elena Chen, loyalty_id: XA198800, tier: Platinum Elite, hub: SIN, member_since: "2017-03-14", ltv_usd: 52400,
                  bookings_12m: 14, bookings_prev_12m: 21, last_booking_date: "2026-09-29", nps_last: 5, as_of: "2026-11-20",
                  history: [{date: "2026-10-25", type: disruption, detail: "SIN-LHR delayed 3h10, missed onward connection"},
                            {date: "2026-11-03", type: disruption, detail: "LHR-SIN cancelled, rebooked next day"},
                            {date: "2026-11-15", type: competitor_browsing, detail: "Viewed a competitor's SIN-DXB fare page"},
                            {date: "2026-11-17", type: redemption_decline, detail: "Upgrade with miles declined"}]}
      - name: history
        actions: [score, check]
        type: any
        file: [json, csv, ndjson, txt]
        description: "For one passenger: the dated events to count parameters from ([{date, type, detail}]), when they are not inside the profile. In a journey they come from ingestion"
      - name: sample
        choices: [elena_chen, passengers, disruption, churn_outcomes]
        description: "Use a bundled synthetic sample instead of your data: elena_chen (one rich profile), passengers (40, for churn), disruption (a cancelled flight's passengers, for disruption_sensitivity), churn_outcomes (2,400 labelled rows, for calibrate)"
      - name: as_of
        actions: [score, check]
        description: "The date event windows are counted back from (YYYY-MM-DD); default: the profile's as_of, else the latest event's date"
      - name: history_complete
        actions: [score, check]
        type: boolean
        description: "True when the history is the passenger's whole history for the windows, so an event type with no events counts as zero; default false (unknown)"
      - name: model
        actions: [score]
        type: any
        file: [json]
        description: "A model to score with on this call ({intercept | base_rate, terms: [{parameter, weight, low, high, reference}]}), for example one `calibrate` returned; `default` forces the default scorecard"
      - name: outcomes
        actions: [calibrate]
        type: any
        file: [csv, json, ndjson]
        description: "calibrate: your labelled rows, one per passenger, with the model's parameters as columns and the outcome (true/false or 1/0) in the column the objective names (churn: churned); at least 300 rows and 40 of each outcome"
      - name: outcome_field
        actions: [calibrate]
        description: "calibrate: the outcome column's name when it is not the objective's own (churned, adverse_outcome, booked, accepted_offer)"
      - name: save
        actions: [calibrate]
        type: boolean
        description: "calibrate: keep the fitted model as your model for this objective when it validates (default false: it is returned, not kept)"
      - name: reset
        actions: [calibrate]
        type: boolean
        description: "calibrate: retire your calibrated model for this objective and return to the default scorecard"
    actions:
      - id: score
        title: Calculate the propensity
        basis: calculated
        produces: [propensity_score]
        output_keys: [objective, score, decision, priority, act, window, drivers, confidence, coverage, parameters_used, parameters_missing, passenger, explanation, model, method]
        example:
          summary: "Calculated churn propensity 89% for Elena Chen: RETAIN CRITICAL"
          result:
            objective: churn
            score: 0.8854
            decision: RETAIN CRITICAL
            priority: HIGH
            act: immediately
            window: next 90 days
            confidence: high
            coverage: 1.0
            drivers:
              - {driver: Disruptions in the last 28 days, parameter: disruptions_28d, value: 3, effect: raises, weight: 0.235, source: "counted from 3 events in the 28 days to 2026-11-20"}
              - {driver: Competitor fare views in the last 28 days, parameter: competitor_browsing_28d, value: 2, effect: raises, weight: 0.183, source: "counted from 2 events in the 28 days to 2026-11-20"}
            model: {objective: churn, source: default, version: "2026.11"}
      - id: check
        title: Say what my data supports
        basis: calculated
        produces: [readiness]
        output_keys: [supports, passengers, events_typed, events_untyped]
        example:
          summary: "This data supports churn propensity, conversion propensity, upsell propensity; not disruption sensitivity (1 passenger)."
          result:
            passengers: 1
            supports: [{objective: churn, name: Churn propensity, can_score: true, records_that_can_be_scored: 1, records: 1, coverage: 1.0}]
      - id: describe
        title: Say what can be predicted, and from what
        basis: calculated
        produces: [capabilities]
        output_keys: [predictions, method, limits, actions, accepts, samples]
        example:
          summary: "Predicts churn propensity, disruption sensitivity, conversion propensity, upsell propensity. Each is calculated from declared parameters; none is a model's guess."
          result:
            predictions: [{id: churn, name: Churn propensity, window: next 90 days, minimum: {parameters: 3, share_of_weight: 0.4}}]
      - id: calibrate
        title: Fit the model to my outcomes
        basis: calculated
        produces: [propensity_model]
        output_keys: [objective, usable, saved, why_not_saved, holdout, default_on_same_holdout, rows, model, how_to_use]
        example:
          summary: "Fitted churn propensity on 1826 rows, validated on 574: AUC 0.6863 against 0.6748 for the default; usable"
          result:
            objective: churn
            usable: true
            saved: false
            holdout: {auc: 0.6863, brier: 0.0919, lift_top_tenth: 2.48, base_rate: 0.1063}
            default_on_same_holdout: {auc: 0.6748, brier: 0.1427}

  - id: vai_personalization
    name: 1:1 Personalization Agent
    accelerator: VoyagerAI
    category: strategy
    tier: pro
    summary: Matches the passenger to a pre-built micro-segment and composes a bespoke offer calibrated to lifetime value, route preferences, behavioural context and policy cost guardrails.
    description: >-
      The fifth stage. From the score, the lifetime value, the tier and the route preferences, matches the passenger to a
      micro-segment (platinum-at-risk-premium-ltv, silver-overnight-care ...) and composes the 1:1 offer - an upgrade, bonus
      miles, a travel credit, lounge access, a pre-selected alternative flight, a hotel and meal - within the policy's cost
      guardrails, with the personalisation match. 50% faster than manual segmentation.
    keywords: [personalization, micro-segment, offer, upgrade, miles, credit, lounge, rebooking, guardrails, ltv]
    feeds: [vai_content_generation]
    use_cases:
      - Compose a 1:1 retention offer for a Platinum Elite passenger scored 81% churn with $52,400 LTV
      - Pre-select the best alternative flight and compose the re-accommodation for this travel group
    verify: caf.accelerators.voyagerai:verify
    minimum: [score, profile]
    inputs:
      - name: score
        type: any
        file: [json]
        description: "The propensity result the offer answers ({objective, score, decision, drivers}): the Predictive Propensity Agent's result, never a figure of your own"
        example: {objective: churn, score: 0.8854, decision: RETAIN CRITICAL, priority: HIGH, drivers: [{driver: Disruptions in the last 28 days, value: 3, effect: raises}]}
      - name: profile
        type: any
        file: [json]
        description: The unified profile (tier, LTV, hub, route preferences, segments)
        example: {name: Elena Chen, tier: Platinum Elite, hub: SIN, ltv_usd: 52400, segments: [platinum-elite, long-haul-business]}
      - name: inventory
        type: any
        file: [json, csv]
        description: "What can be offered: seat inventory, alternative flights, hotel availability, miles and credit budgets. Without it the offer names no specific seat or flight"
      - name: guardrails
        type: any
        file: [json]
        description: "The cost limits the offer is checked against by code: {max_miles, max_credit_usd} or {by_tier_level: {0..3: {max_miles, max_credit_usd}}}. Without them this layer's illustrative defaults apply and the run says so"
        example: {by_tier_level: {"3": {max_miles: 40000, max_credit_usd: 600}}}
    actions:
      - id: compose
        title: Match the segment and compose the offer
        produces: [offer]
        basis: authored
        output_keys: [segment, offer, cost, within_guardrails, guardrails_checked, rationale]
        example:
          summary: "Matched to micro-segment 'platinum-at-risk-premium-ltv' and composed a 1:1 retention offer"
          result:
            segment: platinum-at-risk-premium-ltv
            offer: {headline: "Elena, your loyalty means the world to us.", action: "First Class upgrade SIN → LHR", miles: "30,000 bonus miles", credit: "$500 travel credit", lounge: "Flagship First + Arrivals Lounge LHR"}
            cost: {miles: 30000, credit_usd: 500, upgrade: "F from J, SIN-LHR"}
            within_guardrails: true
            rationale: "Retention of a $52,400 LTV passenger scored RETAIN CRITICAL; the upgrade answers the three disruptions, the miles the declined redemptions."
    skill:
      system_prompt: You are VoyagerAI's personalisation agent. You pick the micro-segment the evidence supports and compose one offer that answers the drivers of the score, priced within the guardrails you are given; an offer that would breach them is flagged for a person, not sent.
      checklist:
        - The segment match is explained by the profile and the score
        - Each element of the offer answers a named driver
        - The cost is stated as numbers (cost.miles, cost.credit_usd) so the guardrail check can read them
        - No score, probability or match rate is stated that was not in the score you were given

  - id: vai_content_generation
    name: Content Generation Agent
    accelerator: VoyagerAI
    category: content
    tier: balanced
    summary: Generates channel-specific creatives - email, push, SMS, in-app banner, a one-tap rebooking card - personalised to the passenger and the offer, with A/B variants and the tone profile applied.
    description: >-
      The sixth stage. Writes the creatives that carry the offer on each channel - push, email, SMS, in-app banner, a one-tap
      rebooking or care card - in the tone profile the journey calls for (premium-appreciative, proactive-empathetic,
      reassuring-clear), with A/B subject lines. 60% faster content variation.
    keywords: [creatives, email, push, sms, banner, rebooking card, a/b, subject lines, tone, variants]
    feeds: [vai_omnichannel_activation]
    use_cases:
      - Generate 4 channel creatives and 2 A/B subject lines for this retention offer in a premium-appreciative tone
      - Generate a one-tap rebooking card and 3 message variants in a proactive-empathetic tone
    verify: caf.accelerators.voyagerai:verify
    minimum: [offer]
    inputs:
      - name: offer
        type: any
        file: [json]
        description: The composed offer (headline, action, miles, credit, lounge, flight); bound from the personalisation stage in a journey
        example: {headline: "Elena, your loyalty means the world to us.", action: "First Class upgrade SIN → LHR", miles: "30,000 bonus miles"}
      - name: channels
        type: list
        description: "The channels to write for (default: push, email, sms, banner)"
        example: [push, email, sms, banner]
      - name: tone
        description: "The tone profile: premium-appreciative, proactive-empathetic, reassuring-clear"
        example: premium-appreciative
      - name: passenger
        type: any
        description: Who it is for (name, tier, language)
    actions:
      - id: generate
        title: Generate the channel creatives
        produces: [creatives]
        basis: authored
        output_keys: [variants, channels, tone, ab_test, creatives]
        example:
          summary: "Generated 2 channel creatives and 2 A/B subject lines"
          result:
            variants: 2
            channels: [push, sms]
            tone: premium-appreciative
            ab_test: {subject_a: "Elena, a First Class thank-you for your loyalty", subject_b: "Your next SIN → LHR, in First, on us"}
            creatives:
              - {channel: push, text: "Elena, your loyalty means the world to us. A First Class upgrade on SIN → LHR is waiting - tap to claim.", cta: Claim upgrade}
              - {channel: sms, text: "Elena, 30,000 bonus miles and a $500 travel credit are on your account. Your First Class upgrade SIN → LHR is ready in the app.", cta: ""}
    skill:
      system_prompt: You are VoyagerAI's content generation agent. You write every creative from the offer as composed, in the tone profile named, within each channel's length and format, and you never promise anything the offer does not contain.
      checklist:
        - Every creative carries only what the offer contains
        - Channel limits are respected (push and SMS short, email full)
        - The tone profile is applied consistently; A/B variants differ in one thing

  - id: vai_omnichannel_activation
    name: Omnichannel Activation Agent
    accelerator: VoyagerAI
    category: activation
    tier: balanced
    summary: Activates across website, app, push, SMS, email, social and offline channels with intelligent sequencing, per-channel fatigue and frequency rules, and fallbacks; the send itself is held for a person here.
    description: >-
      The seventh stage. Sequences the creatives across the channels - push immediately, email a few minutes later, SMS as a
      backup, the banner on the next open - under the fatigue and frequency rules, with fallbacks and 100% coverage. On this
      layer the channels are not connected: the activation plan is produced and the send is held as an action for a person.
    keywords: [activation, omnichannel, sequencing, fatigue, frequency, push, email, sms, banner, delivery, fallback]
    feeds: [vai_continuous_feedback]
    use_cases:
      - Sequence these 4 creatives across push, email, SMS and banner with fatigue suppression
      - Push the rebooking card immediately with email and SMS as backups
    verify: caf.accelerators.voyagerai:verify
    minimum: [creatives]
    inputs:
      - name: creatives
        type: any
        file: [json]
        description: The creatives per channel from content generation; bound from that stage in a journey
        example: [{channel: push, text: "..."}, {channel: email, text: "..."}]
      - name: rules
        type: any
        description: "Fatigue and frequency rules per channel, quiet hours, the passenger's channel preferences"
      - name: urgency
        description: "immediate (disruptions) or standard (default)"
        example: standard
    actions:
      - id: activate
        title: Sequence and activate
        produces: [activation_plan]
        output_keys: [sequence, coverage, suppressed, fallbacks, sent]
        needs_home: true
        example:
          summary: "Activated all 4 channels with intelligent sequencing and fatigue suppression (plan; the send is held for approval)"
          result:
            sequence: [{channel: push, at: immediate}, {channel: email, at: "+3 min"}, {channel: sms, at: "+8 min"}, {channel: banner, at: next open}]
            coverage: "2 of 2 creatives sequenced"
            sent: false
            suppressed: []
            fallbacks: {push_unread_2h: sms}
    skill:
      system_prompt: "You are VoyagerAI's omnichannel activation agent. You order the creatives across channels under the fatigue, frequency and preference rules you are given, with fallbacks, and you present the plan: the send is a person's decision here."
      checklist:
        - Every creative has a channel, a time and a fallback
        - Fatigue and frequency rules are applied and suppressions listed
        - The plan says what would be sent, by which system, and that it is held

  - id: vai_continuous_feedback
    name: Continuous Feedback Agent
    accelerator: VoyagerAI
    category: experimentation
    tier: balanced
    summary: Arms the feedback loop - tracks engagement, conversion and revenue impact, auto-selects winning variants, and fires escalation journeys when there is no engagement - and reports the result against the baseline.
    description: >-
      The eighth stage. Defines the metrics the journey is measured on, the A/B auto-selection, the escalation (an enhanced
      offer after 18 hours without engagement, an agent callback after 2 hours during a disruption) and the surveys (NPS at
      +24 h or post-arrival), and reports the outcome: churn risk before and after.
    keywords: [feedback loop, measurement, engagement, conversion, revenue impact, a/b, escalation, nps, optimization]
    use_cases:
      - Arm the loop for this retention journey with 18h escalation to an enhanced offer
      - Confirm the rebooking, queue a +24h satisfaction survey and arm the loop
    verify: caf.accelerators.voyagerai:verify
    minimum: [[activation, offer]]
    inputs:
      - name: activation
        type: any
        file: [json]
        description: The activation plan (channels, sequence)
        example: {sequence: [{channel: push, at: "T+0"}, {channel: email, at: "T+2h"}], suppress: ["sms: quiet hours"]}
      - name: offer
        type: any
        description: The offer sent, for the escalation to build on
        example: {segment: platinum-at-risk, offer: {miles: "25,000 bonus miles", credit: "$300 travel credit"}, cost: {miles: 25000, credit_usd: 300}}
      - name: baseline
        type: any
        description: "The metric before the journey: {metric, before}, the calculated score. In a journey it is read from the propensity stage"
        example: {metric: churn propensity, before: 0.8854}
      - name: outcomes
        type: any
        file: [json, csv]
        description: "Measured events after the send (opens, clicks, claims, bookings), when there are any. Without them the result after the journey stays empty: nothing is projected as an outcome"
    actions:
      - id: arm
        title: Arm the feedback loop
        produces: [feedback_loop]
        basis: authored
        evidence: [outcomes]
        output_keys: [metrics_tracked, escalation, optimization, surveys, result, loop]
        example:
          summary: "Armed the loop tracking 9 metrics, with 18h escalation to an enhanced offer if no engagement"
          result:
            metrics_tracked: [push open, email open, email click, sms click, banner click, offer claimed, booking made, revenue, churn risk]
            escalation: {after: 18h, condition: no engagement, action: enhanced offer}
            optimization: AI auto A/B
            surveys: [{kind: NPS, at: "+24h"}]
            result: {metric: churn propensity, before: 0.8854, after: null, basis: "not measured yet: the loop is armed; the value arrives with the journey's events"}
            loop: ARMED
    skill:
      system_prompt: You are VoyagerAI's continuous feedback agent. You define what the journey is measured on, the escalation and the surveys, and you report outcomes as measured where events exist and as modelled - said so - where they do not yet.
      checklist:
        - Every tracked metric has a source event
        - Escalation has a condition, a delay and an action
        - The result after the journey is left empty until events are measured; nothing is projected as an outcome

flows:
  - id: vai_passenger_journey
    name: VoyagerAI · Passenger journey
    stage: Journey
    description: The whole VoyagerAI pipeline for one passenger and one trigger, from the raw signals to the armed feedback loop. The first four stages calculate; the last four write, and code checks them.
    inputs:
      - name: signals
        file: [json, csv, ndjson, txt]
        description: "The signals: [{type, date, source, detail, severity}] as JSON or CSV, or lines of text"
        required: true
        example: [{type: disruption, date: "2026-10-25", source: PSS, detail: "SIN-LHR delayed 3h10, missed onward connection", severity: high}, {type: disruption, date: "2026-11-03", source: PSS, detail: "LHR-SIN cancelled, rebooked next day", severity: critical}, {type: competitor_browsing, date: "2026-11-15", source: Web analytics, detail: "Viewed a competitor's SIN-DXB fare page", severity: critical}, {type: redemption_decline, date: "2026-11-17", source: Loyalty engine, detail: "Upgrade with miles declined", severity: medium}, {type: app_uninstall_intent, date: "2026-11-18", source: App telemetry, detail: "Uninstall flow opened", severity: high}]
      - name: passenger
        file: [json]
        description: "Who it is about: an identifier, name, tier and the profile fields you have (bookings, dates, NPS, LTV)"
        required: true
        example: {passenger_id: P-204117, name: Elena Chen, loyalty_id: XA198800, tier: Platinum Elite, hub: SIN, ltv_usd: 52400, bookings_12m: 14, bookings_prev_12m: 21, nps_last: 5, segments: [platinum-elite, long-haul-business]}
      - name: tone
        description: "The tone profile for the creatives: premium-appreciative, proactive-empathetic, reassuring-clear"
        example: premium-appreciative
    steps:
      - {id: ingest, agent: vai_data_ingestion, purpose: Type the signals into one event set}
      - {id: model, agent: vai_data_modelling, purpose: Derive the parameters, inputs: {events: "${steps.ingest.output.result}"}, needs: [ingest]}
      - {id: identity, agent: vai_identity_stitching, purpose: One profile from the fragments, inputs: {record: "${steps.model.output.result}"}, needs: [model]}
      - {id: score, agent: vai_predictive_propensity, purpose: Calculate the propensity and set the decision, inputs: {profile: "${steps.identity.output.result.profile}"}, needs: [identity]}
      - {id: offer, agent: vai_personalization, purpose: Match the segment and compose the offer, inputs: {score: "${steps.score.output.result}", profile: "${steps.identity.output.result.profile}"}, needs: [score]}
      - {id: creatives, agent: vai_content_generation, purpose: Generate the channel creatives, inputs: {offer: "${steps.offer.output.result.offer}"}, needs: [offer]}
      - {id: activate, agent: vai_omnichannel_activation, purpose: Sequence across channels (a dry run; nothing is sent), inputs: {creatives: "${steps.creatives.output.result.creatives}"}, needs: [creatives]}
      - {id: feedback, agent: vai_continuous_feedback, purpose: Arm the feedback loop, inputs: {activation: "${steps.activate.output.result}", offer: "${steps.offer.output.result.offer}"}, needs: [activate]}
  - id: vai_churn_prevention
    name: VoyagerAI · Churn prevention
    stage: Journey
    description: Retain a high-value passenger showing competitor-browsing behaviour; the page's first use case. The churn propensity is calculated from the signals and the profile.
    inputs:
      - name: signals
        file: [json, csv, ndjson, txt]
        description: The composite churn signals, typed and dated
        required: true
        example: [{type: disruption, date: "2026-10-25", source: PSS, detail: "SIN-LHR delayed 3h10, missed onward connection", severity: high}, {type: disruption, date: "2026-11-03", source: PSS, detail: "LHR-SIN cancelled, rebooked next day", severity: critical}, {type: competitor_browsing, date: "2026-11-15", source: Web analytics, detail: "Viewed a competitor's SIN-DXB fare page", severity: critical}, {type: redemption_decline, date: "2026-11-17", source: Loyalty engine, detail: "Upgrade with miles declined", severity: medium}, {type: app_uninstall_intent, date: "2026-11-18", source: App telemetry, detail: "Uninstall flow opened", severity: high}]
      - name: passenger
        file: [json]
        description: The passenger, with an identifier and the profile fields you have
        required: true
        example: {passenger_id: P-204117, name: Elena Chen, loyalty_id: XA198800, tier: Platinum Elite, hub: SIN, ltv_usd: 52400, bookings_12m: 14, bookings_prev_12m: 21, nps_last: 5, segments: [platinum-elite, long-haul-business]}
    steps:
      - {id: ingest, agent: vai_data_ingestion, purpose: Type the signals into one event set}
      - {id: model, agent: vai_data_modelling, purpose: Derive the parameters, inputs: {events: "${steps.ingest.output.result}"}, needs: [ingest]}
      - {id: identity, agent: vai_identity_stitching, purpose: One profile from the fragments, inputs: {record: "${steps.model.output.result}"}, needs: [model]}
      - {id: score, agent: vai_predictive_propensity, purpose: Calculate the propensity and set the decision, inputs: {profile: "${steps.identity.output.result.profile}", objective: churn}, needs: [identity]}
      - {id: offer, agent: vai_personalization, purpose: Match the segment and compose the offer, inputs: {score: "${steps.score.output.result}", profile: "${steps.identity.output.result.profile}"}, needs: [score]}
      - {id: creatives, agent: vai_content_generation, purpose: Generate the channel creatives, inputs: {offer: "${steps.offer.output.result.offer}", tone: premium-appreciative}, needs: [offer]}
      - {id: activate, agent: vai_omnichannel_activation, purpose: Sequence across channels (a dry run; nothing is sent), inputs: {creatives: "${steps.creatives.output.result.creatives}"}, needs: [creatives]}
      - {id: feedback, agent: vai_continuous_feedback, purpose: Arm the feedback loop, inputs: {activation: "${steps.activate.output.result}", offer: "${steps.offer.output.result.offer}"}, needs: [activate]}
  - id: vai_irops_recovery
    name: VoyagerAI · IROPS recovery
    stage: Journey
    description: Re-accommodate a travel group after a cancellation; the page's second use case. Disruption sensitivity is calculated from the disruption's own facts on the passenger record.
    inputs:
      - name: signals
        file: [json, csv, ndjson, txt]
        description: The cancellation and the passenger's recent disruptions
        required: true
        example: [{type: disruption, date: "2026-11-20", source: OpsCenter, detail: "XA217 LHR-SIN cancelled (technical)", severity: critical}, {type: disruption, date: "2026-11-04", source: PSS, detail: "SIN-LHR delayed 2h20", severity: medium}]
      - name: passenger
        file: [json]
        description: "The lead passenger with the disruption's facts: is_cancelled or delay_minutes, missed_connection, overnight_required, rebook_options, party_size"
        required: true
        example: {passenger_id: P-300104, name: James Okafor, pnr: Q4T8ZN, tier: Gold, hub: LHR, is_cancelled: true, missed_connection: true, overnight_required: true, rebook_options: 1, party_size: 2, travel_purpose: business}
      - name: inventory
        file: [json, csv]
        description: The alternative flights and seats available
    steps:
      - {id: ingest, agent: vai_data_ingestion, purpose: Type the signals into one event set}
      - {id: model, agent: vai_data_modelling, purpose: Derive the parameters, inputs: {events: "${steps.ingest.output.result}", target_schema: irops_v2}, needs: [ingest]}
      - {id: identity, agent: vai_identity_stitching, purpose: One profile from the fragments, inputs: {record: "${steps.model.output.result}"}, needs: [model]}
      - {id: score, agent: vai_predictive_propensity, purpose: Calculate the propensity and set the decision, inputs: {profile: "${steps.identity.output.result.profile}", objective: disruption_sensitivity}, needs: [identity]}
      - {id: offer, agent: vai_personalization, purpose: Match the segment and compose the offer, inputs: {score: "${steps.score.output.result}", profile: "${steps.identity.output.result.profile}"}, needs: [score]}
      - {id: creatives, agent: vai_content_generation, purpose: Generate the channel creatives, inputs: {offer: "${steps.offer.output.result.offer}", tone: proactive-empathetic, channels: [push, email, sms]}, needs: [offer]}
      - {id: activate, agent: vai_omnichannel_activation, purpose: Sequence across channels (a dry run; nothing is sent), inputs: {creatives: "${steps.creatives.output.result.creatives}", urgency: immediate}, needs: [creatives]}
      - {id: feedback, agent: vai_continuous_feedback, purpose: Arm the feedback loop, inputs: {activation: "${steps.activate.output.result}", offer: "${steps.offer.output.result.offer}"}, needs: [activate]}
  - id: vai_airport_disruption
    name: VoyagerAI · Airport disruption
    stage: Journey
    description: Proactive overnight care for a mid-tier flyer during a hub-wide ground stop; the page's third use case.
    inputs:
      - name: signals
        file: [json, csv, ndjson, txt]
        description: The ground stop, the weather and the at-risk itinerary
        required: true
        example: [{type: disruption, date: "2026-11-20", source: OpsCenter, detail: "Ground stop at the hub: winter storm, ramp closed until 22:00", severity: critical}, {type: disruption, date: "2026-11-20", source: PSS, detail: "XA1492 delayed 4h+, connection at risk", severity: high}]
      - name: passenger
        file: [json]
        description: "The passenger with the disruption's facts: delay_minutes, missed_connection, overnight_required, rebook_options"
        required: true
        example: {passenger_id: P-300231, name: Daniel Brooks, loyalty_id: XA551207, tier: Silver, hub: YYC, ltv_usd: 9800, delay_minutes: 250, missed_connection: true, overnight_required: true, rebook_options: 0, party_size: 1}
      - name: guardrails
        file: [json]
        description: "The cost limits for mid-tier care: {max_miles, max_credit_usd}"
        example: {max_miles: 5000, max_credit_usd: 220}
    steps:
      - {id: ingest, agent: vai_data_ingestion, purpose: Type the signals into one event set}
      - {id: model, agent: vai_data_modelling, purpose: Derive the parameters, inputs: {events: "${steps.ingest.output.result}", target_schema: overnight_impact_v1}, needs: [ingest]}
      - {id: identity, agent: vai_identity_stitching, purpose: One profile from the fragments, inputs: {record: "${steps.model.output.result}"}, needs: [model]}
      - {id: score, agent: vai_predictive_propensity, purpose: Calculate the propensity and set the decision, inputs: {profile: "${steps.identity.output.result.profile}", objective: disruption_sensitivity}, needs: [identity]}
      - {id: offer, agent: vai_personalization, purpose: Match the segment and compose the offer, inputs: {score: "${steps.score.output.result}", profile: "${steps.identity.output.result.profile}"}, needs: [score]}
      - {id: creatives, agent: vai_content_generation, purpose: Generate the channel creatives, inputs: {offer: "${steps.offer.output.result.offer}", tone: reassuring-clear, channels: [push, sms, email]}, needs: [offer]}
      - {id: activate, agent: vai_omnichannel_activation, purpose: Sequence across channels (a dry run; nothing is sent), inputs: {creatives: "${steps.creatives.output.result.creatives}", urgency: immediate}, needs: [creatives]}
      - {id: feedback, agent: vai_continuous_feedback, purpose: Arm the feedback loop, inputs: {activation: "${steps.activate.output.result}", offer: "${steps.offer.output.result.offer}"}, needs: [activate]}
