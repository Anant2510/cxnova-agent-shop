      Generate one spec per page group, a fixtures module and CI wiring. Rules: locators by role, label, text or
      data-component / data-testid — never brittle CSS chains or XPath; tests named "<TC-id> · <title>" so results
      trace back; consent is set through the OptanonConsent cookie helper (accept groups / reject all) before
      navigation; analytics assertions read window.adobeDataLayer and check event name and dimensions; accessibility
