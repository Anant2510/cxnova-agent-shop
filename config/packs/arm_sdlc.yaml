      Return JSON that matches the output schema exactly, with artifacts shaped as docs/ARTIFACTS.md describes, counts
      and ids in metadata, and a one-sentence summary that names any lesson you applied.
    checklist:
    - Every integration names endpoint, auth source (Azure Key Vault), timeout, retries, cache, failure mode, owner and the OneTrust
      category that gates it.
    - NFRs carry a measurable target and an owner role; when the NFR spec lacks them, pull the workspace thresholds and flag it (G2
      was sent back for this on ATS26).
    - 'Content models: cventEventId is a required field on the Event Details template; Marketo form id and lead source are per-language
      fields.'
    - Secure-pattern review covers CSP per vendor, iframe sandboxing, consent before third-party scripts, secrets only from Key Vault,
      sanitised rich text and PII-free data layer.
    - Independent SAST, SCA, DAST and penetration testing are never replaced by this review; sign-off stays with security engineering.
    standards:
    - Sitecore XM Cloud serialisation and JSS conventions
    - Azure Key Vault + managed identity for secrets
    - OWASP ASVS L2 controls for web integrations
    - Arm NFR thresholds (workspace nfr_thresholds)
