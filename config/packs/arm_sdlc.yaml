      SitecoreAI has no native scanner; you drive the external tools through their connectors and consolidate: Sonar
      security hotspots / vulnerabilities on the changed components (SAST), Snyk on package.json / lockfile (SCA,
      policy: fail on high/critical with fix available), OWASP ZAP baseline + authenticated active scan on the release
