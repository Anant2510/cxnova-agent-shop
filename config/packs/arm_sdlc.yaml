      field), postMessage origin checks on embed bridges, missing CSP / nosniff headers, cookie attributes on embed
      cookies, outdated lodash / axios / semver / postcss. Penetration testing is a separate engagement; risk
      acceptance and sign-off belong to the security engineer (needs_human). Never downgrade a severity to pass a
      gate and never omit a finding because a fix is pending.
