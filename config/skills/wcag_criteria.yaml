# Deterministic remediation per axe rule id: fix = plain English, snippet = example markup/CSS.
rule_fixes:
  image-alt:
    fix: Give every informative image a text alternative that conveys its purpose; give purely decorative images an empty alt so screen readers skip them.
    snippet: |
      <img src="/assets/hero-home.svg" alt="Family outside their insured home">
      <!-- decorative -->
      <img src="/assets/divider.svg" alt="">
  input-image-alt:
    fix: Image buttons need alt text describing the action, not the picture.
    snippet: <input type="image" src="/img/search.svg" alt="Search">
  svg-img-alt:
    fix: SVGs with role="img" need an accessible name via <title> or aria-label.
    snippet: <svg role="img" aria-label="Company logo">...</svg>
  role-img-alt:
    fix: Elements with role="img" need an accessible name (aria-label or aria-labelledby).
    snippet: <div role="img" aria-label="Rating 4.7 out of 5"></div>
  label:
    fix: Every form field needs a programmatic label - a <label for> element, a wrapping label, or aria-label / aria-labelledby. Visible text next to the field is not enough unless it is a <label>.
    snippet: |
      <label for="newsletter-email">Email address</label>
      <input id="newsletter-email" type="email" name="email" autocomplete="email">
  select-name:
    fix: Give each <select> a programmatic label.
    snippet: |
      <label for="cover-type">Cover type</label>
      <select id="cover-type" name="cover">...</select>
  button-name:
    fix: Buttons must expose an accessible name - visible text, or aria-label for icon-only buttons.
    snippet: <button type="button" aria-label="Close dialog"><svg aria-hidden="true" focusable="false">...</svg></button>
  link-name:
    fix: Links must have discernible text. For icon-only links add an aria-label (or visually hidden text) that says where the link goes.
    snippet: |
      <a class="chat-fab" href="/contact.html" aria-label="Contact us">
        <svg aria-hidden="true" focusable="false">...</svg>
      </a>
  html-has-lang:
    fix: Declare the page language on the <html> element so screen readers pronounce content correctly.
    snippet: <html lang="en">
  html-lang-valid:
    fix: Use a valid BCP 47 language code in the lang attribute.
    snippet: <html lang="en-US">
  valid-lang:
    fix: lang attributes on elements must use valid language codes.
    snippet: <span lang="fr">Bienvenue</span>
  document-title:
    fix: Give every page a unique, descriptive <title>.
    snippet: <title>Home insurance | Company name</title>
  color-contrast:
    fix: Raise the contrast between text and its background to at least 4.5:1 (3:1 for large text of 24px, or 18.66px bold).
    snippet: |
      /* #a3a3a3 on #ffffff is 2.5:1 - darken the text */
      .fine-print { color: #595959; background-color: #ffffff; } /* 7.0:1 */
  link-in-text-block:
    fix: Links inside text must be distinguishable without colour alone - keep the underline or add another visual cue.
    snippet: "p a { text-decoration: underline; }"
  heading-order:
    fix: Heading levels should only increase by one; change the tag (h4 to h3) and keep the visual style with a CSS class.
    snippet: |
      <h2>What should I photograph?</h2>
      <h3 class="h4-style">Inside the home</h3>
  empty-heading:
    fix: Headings must contain text; remove empty headings or add the missing text.
    snippet: <h2>Compare plans</h2>
  page-has-heading-one:
    fix: Give the page one H1 that names its main topic.
    snippet: <h1>Home insurance</h1>
  landmark-one-main:
    fix: Wrap the primary content in a single <main> landmark.
    snippet: <main id="main">...</main>
  region:
    fix: Keep all content inside landmarks (header, nav, main, aside, footer) so screen-reader users can navigate by region.
    snippet: <footer class="site-footer">...</footer>
  landmark-unique:
    fix: Landmarks of the same type need unique accessible names.
    snippet: <nav aria-label="Footer">...</nav>
  bypass:
    fix: Provide a skip link or landmarks so keyboard users can bypass repeated navigation.
    snippet: <a class="skip-link" href="#main">Skip to content</a>
  list:
    fix: <ul> and <ol> may only directly contain <li>, <script> or <template> elements.
    snippet: "<ul><li>Buildings cover</li><li>Contents cover</li></ul>"
  listitem:
    fix: <li> elements must be inside a <ul> or <ol>.
    snippet: "<ul><li>Item</li></ul>"
  td-has-header:
    fix: Data tables need header cells (<th scope>) so each data cell can be related to its header.
    snippet: |
      <table><thead><tr><th scope="col">Cover</th><th scope="col">Basic</th></tr></thead>
      <tbody><tr><th scope="row">Monthly price from</th><td>$18</td></tr></tbody></table>
  th-has-data-cells:
    fix: Every table header must label at least one data cell.
    snippet: <th scope="col">Premium</th>
  frame-title:
    fix: Give every <iframe> a title describing its content.
    snippet: <iframe src="https://maps.example/embed" title="Map of our Port Ellison office"></iframe>
  nested-interactive:
    fix: Do not nest interactive controls (a button inside a link); use one control.
    snippet: <a class="btn" href="/quote">Get a quote</a>
  scrollable-region-focusable:
    fix: Scrollable regions must be keyboard reachable - add tabindex="0" and an accessible name.
    snippet: <div class="table-scroll" tabindex="0" role="region" aria-label="Pricing table">...</div>
  target-size:
    fix: Make touch targets at least 24 by 24 CSS pixels, or space them so a 24px circle around each does not overlap another.
    snippet: ".plan-tab { min-width: 44px; min-height: 44px; }"
  autocomplete-valid:
    fix: Use valid autocomplete tokens so browsers and assistive tech can identify the purpose of each field.
    snippet: <input type="email" name="email" autocomplete="email">
  aria-allowed-attr:
    fix: Only use ARIA attributes that are allowed for the element's role.
    snippet: <button aria-pressed="false">Premium</button>
  aria-required-attr:
    fix: Add the ARIA attributes that the role requires.
    snippet: <div role="slider" aria-valuenow="5" aria-valuemin="0" aria-valuemax="10" tabindex="0"></div>
  aria-valid-attr-value:
    fix: ARIA attributes must have valid values (ids must exist, tokens must be allowed).
    snippet: <button aria-expanded="false" aria-controls="panel-premium">Premium</button>
  aria-hidden-focus:
    fix: Elements inside aria-hidden="true" must not be focusable.
    snippet: <div aria-hidden="true"><a href="/x" tabindex="-1">...</a></div>
  duplicate-id-aria:
    fix: IDs referenced by ARIA must be unique on the page.
    snippet: <label id="email-label">Email</label>
  meta-viewport:
    fix: Do not disable zoom - remove user-scalable=no and maximum-scale below 2.
    snippet: <meta name="viewport" content="width=device-width, initial-scale=1">
  tabindex:
    fix: Avoid positive tabindex values; use the DOM order (tabindex="0" or none).
    snippet: <div class="plan-tab" role="tab" tabindex="0">Premium</div>
  _default:
    fix: Follow the linked axe-core rule guidance and re-test.
    snippet: ""
