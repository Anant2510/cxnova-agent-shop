# WCAG success criteria + remediation library - consumed by web_accessibility_evaluation.
#
# Detection is axe-core (via Playwright) or the static fallback checks; this file maps every result to
# the WCAG 2.2 success criterion, its name and its conformance level, and holds deterministic fix text
# (used when no model is configured, and as the baseline the model's code snippets are checked against).
version: "1.0.0"

# Standard -> axe-core runOnly tags
standards:
  wcag2a: {label: WCAG 2.0 Level A, tags: [wcag2a]}
  wcag2aa: {label: WCAG 2.0 Level AA, tags: [wcag2a, wcag2aa]}
  wcag21a: {label: WCAG 2.1 Level A, tags: [wcag2a, wcag21a]}
  wcag21aa: {label: WCAG 2.1 Level AA, tags: [wcag2a, wcag2aa, wcag21a, wcag21aa]}
  wcag22aa: {label: WCAG 2.2 Level AA, tags: [wcag2a, wcag2aa, wcag21a, wcag21aa, wcag22aa]}

impact_order: [minor, moderate, serious, critical]
# Score = 100 x passed-rule weight / (passed-rule weight + violated-rule weight)
scoring:
  pass_weight: 3
  violation_weights: {critical: 10, serious: 7, moderate: 3, minor: 1}

# WCAG 2.2 success criteria: sc -> [name, level, introduced in]
