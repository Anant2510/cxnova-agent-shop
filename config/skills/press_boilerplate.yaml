# Press release record (Press Release Creation agent).
# Owned by Communications + Legal and version-controlled: the agent inserts the boilerplate, media
# contact and legal disclaimers from this file verbatim - the model never writes them.
# DEMO BRAND: Meridian Mutual is fictional. Replace this file per client (or per region, via CAF_SKILLS_DIR).
version: "2026.3"
organisation: Meridian Mutual
legal_name: Meridian Mutual Insurance Company
name_variants: [Meridian Mutual, Meridian]       # any of these in the lead satisfies the "who" check
headquarters_dateline: "Springfield, Illinois"   # used when no location is given

boilerplate:
  heading: About Meridian Mutual
  text: >-
    Meridian Mutual is a fictional mutual insurer created to demonstrate the Coforge Agentic
    Framework. It provides home, car, pet and travel insurance to households across the United States,
    with claims handled by people who care and prevention advice that helps customers avoid losses.
    Learn more at www.meridian-mutual.example.

# Leave empty to fall back to brand_voice.media_contact.
media_contact: {}

disclaimers:
  forward_looking:
    heading: Forward-looking statements
    text: >-
      This press release contains forward-looking statements, including statements about expected
      product availability, plans, benefits and results. These statements are based on current
      expectations and are subject to risks and uncertainties that could cause actual results to differ
      materially. Meridian Mutual undertakes no obligation to update any forward-looking statement,
      except as required by law.
  always: []                                    # e.g. product disclaimers appended to every release
  product: "Cover is subject to terms, conditions and underwriting criteria."

# Words that make a statement forward-looking (whole-word, case-insensitive). Any hit in the
# model-written text triggers the safe-harbour disclaimer above.
forward_looking_terms: [expects, expected, expect, anticipates, anticipated, anticipate, plans, planned, plan to,
                        will, forecast, forecasts, intends, intend, believes, believe, estimates, projects, projected,
                        outlook, aims to, targets, guidance, on track to, going forward]

style:
  release_label: FOR IMMEDIATE RELEASE
  embargo_label: EMBARGOED UNTIL
  end_mark: "###"
  headline_max_chars: 100        # fail above
  headline_warn_chars: 80        # warn above
  subheadline_max_chars: 180
  lead_min_words: 12
  lead_max_words: 45
  word_count: {min: 300, max: 800}
  announcement_verbs: [announce, announces, announced, launch, launches, launched, introduce, introduces, introduced,
                       unveil, unveils, unveiled, appoint, appoints, appointed, name, names, named, partner, partners,
                       partnered, expand, expands, expanded, open, opens, opened, release, releases, released, report,
                       reports, reported, receive, receives, received, win, wins, won, earn, earns, earned, complete,
                       completes, completed, acquire, acquires, acquired, sign, signs, signed, select, selects,
                       selected, award, awards, awarded, debut, debuts, debuted, offer, offers, roll out, rolls out,
                       celebrate, celebrates, achieve, achieves, achieved, join, joins, joined]

