# Brand voice skill - injected into every prompt as `brand`.
# DEMO BRAND: Meridian Mutual is fictional. Replace this file per client (or point CAF_SKILLS_DIR
# at a client folder that contains its own brand_voice.yaml).
name: Meridian Mutual
descriptor: Fictional demo insurer used for the framework's sample data
industry: insurance
website: https://www.meridian-mutual.example
locale: en-US
voice:
  personality: [reassuring, plain-spoken, expert, warm]
  tone: Confident and calm. We explain clearly and never use fear to sell.
  reading_level: Grade 8-9
  person: First person plural ("we") speaking to "you"
  do:
    - Lead with the customer's outcome, then the product
    - Use concrete numbers and examples
    - Keep sentences short; one idea per sentence
  dont:
    - Overpromise cover or claims outcomes
    - Use jargon without explaining it
    - Use fear, urgency tricks or ALL CAPS
banned_phrases:
  - best-in-class
  - world-class
  - synergy
  - guaranteed approval
  - cheapest
  - act now
preferred_terms:
  customer: customer
  premium: price
  policy: policy
messaging_pillars:
  - Claims handled by people who care, with most home claims settled in days
  - Clear cover with no surprises in the small print
  - Prevention first - data and advice that help customers avoid losses
cta_style: Verb-first, specific, five words or fewer
legal:
  footer: Meridian Mutual is a fictional company used for demonstration purposes.
  address: 100 Demo Plaza, Springfield, USA
  disclaimers:
    - Cover is subject to terms, conditions and underwriting criteria.
media_contact:
  name: Jordan Blake
  title: Head of Communications
  email: press@meridian-mutual.example
  phone: "+1 555 0100"
