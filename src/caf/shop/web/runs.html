<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runs · {{PRODUCT}}</title>
<link rel="icon" href="{{BASE}}/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{BASE}}/shop/static/shop.css">
<style>
  .app { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; max-width: 1480px; margin: 0 auto; padding: 16px 16px 60px; align-items: start; }
  @media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); } .list { position: static !important; max-height: 300px !important; }
    .tl .r, .tl .axis { grid-template-columns: 120px 1fr 56px; } .log .e { grid-template-columns: 48px 90px 1fr; } }
  .tw { overflow-x: auto; max-width: 100%; }
  .panel { min-width: 0; }
  .list { position: sticky; top: 62px; max-height: calc(100vh - 78px); display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  .list .head { padding: 12px 12px 8px; display: grid; gap: 8px; border-bottom: 1px solid var(--rule); }
  .list .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .list .seg button { font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--rule-2); background: var(--sheet); cursor: pointer; color: var(--ink-2); }
  .list .seg button[aria-pressed="true"] { background: var(--ai-soft); color: var(--ai); border-color: var(--ai); }
  .list .items { overflow: auto; flex: 1; }
  .item { display: grid; grid-template-columns: 10px 1fr; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--rule); cursor: pointer; background: none; border-left: 3px solid transparent; width: 100%; text-align: left; border-top: 0; border-right: 0; }
  .item:hover { background: var(--wash); } .item[aria-current="true"] { background: var(--ai-soft); border-left-color: var(--ai); }
  .item .g { font-weight: 500; font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink); }
  .item .m { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
  .item .lamp { margin-top: 5px; }
  .lamp.run { background: var(--ai); animation: pulse 1.2s ease-in-out infinite; } .lamp.off { background: var(--rule-2); }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .lamp.run { animation: none; } }
  .chip.live { background: var(--ai-soft); color: var(--ai); border-color: transparent; }
  .detail { display: grid; gap: 14px; min-width: 0; }
  .runhead h1 { font-size: 21px; line-height: 1.25; }
  .meta { color: var(--ink-3); font-size: 12.5px; display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; }
  .meta code { font-size: 12px; }
  .graph { position: relative; overflow: auto; max-height: 470px; min-height: 140px; border: 1px solid var(--rule); border-radius: var(--r-ctl);
           background: radial-gradient(var(--rule) 1px, transparent 1px) 0 0 / 18px 18px, var(--paper); }
  .graph svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .node { position: absolute; width: 230px; background: var(--sheet); border: 1px solid var(--rule-2); border-radius: 8px; box-shadow: var(--shadow); cursor: pointer;
          display: grid; grid-template-columns: 5px 1fr; text-align: left; padding: 0; font: inherit; color: inherit; }
  .node .bar { border-radius: 7px 0 0 7px; } .node .body { padding: 7px 10px 8px; min-width: 0; }
  .node .nm { font-weight: 600; font-size: 13px; line-height: 1.25; display: flex; gap: 6px; align-items: center; }
  .node .nm span.t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .act { font-size: 11px; color: var(--ai); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node.sel { border-color: var(--ai); box-shadow: 0 0 0 2px var(--ai); }
  .node.running { border-color: var(--ai); } .node.skipped, .node.pending { opacity: .62; } .node.pending.sel, .node.skipped.sel { opacity: 1; }
  .tl { display: grid; gap: 4px; font-size: 12px; }
  .tl .r { display: grid; grid-template-columns: 210px 1fr 76px; gap: 10px; align-items: center; cursor: pointer; border-radius: 4px; padding: 2px 4px; }
  .tl .r:hover, .tl .r.sel { background: var(--wash); }
  .tl .lab { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl .track { position: relative; height: 14px; background: var(--wash); border-radius: 3px; }
  .tl .bar { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--matsu); min-width: 3px; }
  .tl .bar.warn { background: var(--kin); } .tl .bar.bad { background: var(--shu); } .tl .bar.run { background: var(--ai); }
  .tl .axis { display: grid; grid-template-columns: 210px 1fr 76px; gap: 10px; color: var(--ink-3); font-size: 11px; padding: 0 4px; }
  .tl .axis .ticks { display: flex; justify-content: space-between; }
  .log { max-height: 420px; overflow: auto; font-size: 12px; display: grid; }
  .log .e { display: grid; grid-template-columns: 62px 150px 1fr; gap: 10px; padding: 3px 4px; border-bottom: 1px solid var(--rule); }
  .log .e .t { color: var(--ink-3); font-variant-numeric: tabular-nums; } .log .e .w { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log .e.model .d { color: var(--ai); } .log .e.bad .d { color: var(--shu); } .log .e.good .d { color: var(--matsu); }
  .stephead { display: grid; grid-template-columns: 5px 1fr; gap: 12px; }
  .stephead .bar { border-radius: 3px; }
  .bind td:first-child { white-space: nowrap; } .bind code { font-size: 12px; }
  .src { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .src .chip.used { background: var(--matsu-soft); color: var(--matsu); border-color: transparent; }
  .src button.chip { cursor: pointer; } .src button.chip:hover { border-color: var(--ai); }
  .val { white-space: pre-wrap; word-break: break-word; max-width: 520px; }
  .jt { font-family: var(--mono); font-size: 12px; line-height: 1.55; }
  .jt details { padding-left: 14px; } .jt summary { cursor: pointer; margin-left: -14px; list-style: none; }
  .jt summary::before { content: "▸ "; color: var(--ink-3); } .jt details[open] > summary::before { content: "▾ "; }
  .jt .k { color: var(--ink-2); } .jt .s { color: var(--matsu); white-space: pre-wrap; word-break: break-word; } .jt .n { color: var(--ai); } .jt .b { color: var(--kin); } .jt .z { color: var(--ink-3); }
  .jt .row { padding-left: 14px; display: block; } .jt .c { color: var(--ink-3); }
  .md p { margin: 0 0 6px; } .md ul { margin: 0 0 6px; padding-left: 18px; } .md h3, .md h4 { margin: 8px 0 4px; font-size: 14px; color: var(--ink); }
  .files .f { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--rule); }
  .preview iframe { width: 100%; height: 520px; border: 1px solid var(--rule); border-radius: var(--r-ctl); background: #fff; }
  .preview img { max-width: 100%; border: 1px solid var(--rule); border-radius: var(--r-ctl); }
  .preview pre { max-height: 520px; }
  .empty { padding: 40px 20px; text-align: center; color: var(--ink-3); }
  .tabs { flex-wrap: wrap; } .tabs button .n { font-size: 11px; color: var(--ink-3); margin-left: 4px; }
  .approvals .a { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--rule); }
</style>
</head>
<body data-product="{{PRODUCT}}" data-company="{{COMPANY}}">
<div id="top"></div>
<main class="app" id="app">
  <aside class="panel list" aria-label="Runs">
    <div class="head">
      <div class="row"><h2 style="font-size:16px">Runs</h2><span class="muted xs right" id="count"></span></div>
      <input type="text" id="q" placeholder="Find a run (goal, flow, id)" aria-label="Find a run">
      <div class="seg" id="seg" role="group" aria-label="Show"></div>
    </div>
    <div class="items" id="items"><div class="empty small">Loading…</div></div>
  </aside>
  <section class="detail" id="detail" aria-live="polite"></section>
</main>
<script src="{{BASE}}/shop/static/shop.js"></script>
<script>
(function () {
  const { h, $, $$, clear, toast, when, catColor, topbar, copy, BASE } = Shop;
  $("#top").replaceWith(topbar("runs"));
  // the operator token (designer, admin) or a customer key (my account): a customer sees its own runs only
  const ADMIN_KEY = "cxnova.shop.admin";
  const readKey = (k) => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };
  const tok = () => readKey(ADMIN_KEY) || Shop.token();
  const api = (path, opts) => Shop.api(path, Object.assign({ token: tok() }, opts || {}));
  const W = 230, COL = 280, ROW = 78, PAD = 16;
  const S = { runs: [], filter: "all", q: "", agents: {}, id: null, view: null, trace: [], sel: null, gtab: "flow", stab: null,
              stepSig: "", preview: null, timer: null, listTimer: null };

  // ---------------------------------------------------------------- formatting
  function put(el, ...kids) { for (const c of kids.flat(Infinity)) { if (c === null || c === undefined || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); } return el; }
  const LABEL = { awaiting_approval: "waiting for approval", completed_with_errors: "completed with errors", needs_approval: "action held",
                  queued: "queued", running: "running", stalled: "stalled", completed: "completed", failed: "failed", pending: "waiting",
                  ok: "ok", degraded: "degraded", error: "error", skipped: "skipped" };
  const label = (s) => LABEL[s] || s || "";
  function runClass(s) { return s === "completed" ? "good" : (s === "completed_with_errors" || s === "awaiting_approval") ? "warn" : (s === "failed" || s === "stalled") ? "bad" : (s === "running" || s === "queued") ? "live" : ""; }
  function lampOf(s) { return s === "ok" || s === "completed" ? "good" : ["degraded", "needs_approval", "awaiting_approval", "completed_with_errors"].includes(s) ? "warn" : ["error", "failed", "stalled"].includes(s) ? "bad" : s === "running" || s === "queued" ? "run" : s === "skipped" ? "off" : ""; }
  function dur(ms) { if (ms === null || ms === undefined || isNaN(ms)) return ""; if (ms < 1000) return Math.round(ms) + " ms"; const s = ms / 1000; if (s < 60) return s.toFixed(1) + " s"; const m = Math.floor(s / 60); return m + " min " + String(Math.round(s % 60)).padStart(2, "0") + " s"; }
  function ago(iso) { const t = Date.parse(iso); if (isNaN(t)) return ""; const s = (Date.now() - t) / 1000; if (s < 45) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago"; if (s < 86400) return Math.round(s / 3600) + " h ago"; return when(iso); }
  const ts = (iso) => { const t = Date.parse(iso); return isNaN(t) ? null : t; };
  function agent(id) { return S.agents[id] || { id, name: (id || "").replace(/_/g, " "), category: "" }; }
  function since(iso) { return h("span", { dataset: { since: iso } }, dur(Date.now() - ts(iso))); }
  function md(text) {   // the run summary: escaped first, then bold, code, bullets and headings
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
    let html = "", list = false;
    for (const line of String(text || "").split("\n")) {
      const b = /^\s*[-*]\s+(.*)$/.exec(line), hd = /^(#{1,4})\s+(.*)$/.exec(line);
      if (b) { if (!list) { html += "<ul>"; list = true; } html += "<li>" + inline(b[1]) + "</li>"; continue; }
      if (list) { html += "</ul>"; list = false; }
      if (hd) html += "<h4>" + inline(hd[2]) + "</h4>"; else if (line.trim()) html += "<p>" + inline(line) + "</p>";
    }
    if (list) html += "</ul>";
    return h("div", { class: "md small", html });
  }

  // ---------------------------------------------------------------- a small JSON viewer (children render when opened)
  function jt(value, key, open) {   // open: how many levels start expanded (true = 1)
    const depth = open === true ? 1 : Number(open) || 0;
    const k = key === undefined ? null : h("span", { class: "k" }, key + ": ");
    if (value === null || value === undefined) return h("span", { class: "row" }, k, h("span", { class: "z" }, "null"));
    if (typeof value !== "object") {
      const cls = typeof value === "string" ? "s" : typeof value === "number" ? "n" : "b";
      let text = typeof value === "string" ? JSON.stringify(value) : String(value);
      if (typeof value === "string" && text.length > 600) {
        const short = text.slice(0, 600) + "…\"";
        const span = h("span", { class: cls }, short);
        return h("span", { class: "row" }, k, span, " ", h("button", { class: "btn sm ghost", type: "button", onclick: (e) => { span.textContent = text; e.target.remove(); } }, "show all"));
      }
      return h("span", { class: "row" }, k, h("span", { class: cls }, text));
    }
    const arr = Array.isArray(value), n = arr ? value.length : Object.keys(value).length;
    const d = h("details", null, h("summary", null, k, h("span", { class: "c" }, arr ? "[" + n + " item" + (n === 1 ? "" : "s") + "]" : "{" + n + " field" + (n === 1 ? "" : "s") + "}")));
    let done = false;
    const fill = () => { if (done) return; done = true; for (const [ck, cv] of arr ? value.map((v, i) => [i, v]) : Object.entries(value)) d.append(jt(cv, ck, depth - 1)); };
    d.addEventListener("toggle", () => { if (d.open) fill(); });
    if (depth > 0 && n) { d.open = true; fill(); }
    return d;
  }
  function valueView(v) {
    if (v === undefined) return h("span", { class: "muted" }, "—");
    if (v !== null && typeof v === "object") return h("div", { class: "jt" }, jt(v, undefined, false));
    const s = String(v);
    if (s.length <= 240) return h("div", { class: "val" }, s);
    const el = h("div", { class: "val" }, s.slice(0, 240) + "…");
    return h("div", null, el, h("button", { class: "btn sm ghost", type: "button", onclick: (e) => { el.textContent = s; e.target.remove(); } }, "show all"));
  }

  // ---------------------------------------------------------------- the list of runs
  const FILTERS = [["all", "All"], ["live", "Live"], ["approval", "Needs approval"], ["done", "Completed"], ["bad", "Failed"]];
  function matches(r) {
    const f = S.filter, s = r.status;
    if (f === "live" && !["running", "queued"].includes(s)) return false;
    if (f === "approval" && s !== "awaiting_approval") return false;
    if (f === "done" && !["completed", "completed_with_errors"].includes(s)) return false;
    if (f === "bad" && !["failed", "stalled"].includes(s)) return false;
    const q = S.q.toLowerCase();
    return !q || [r.goal, r.label, r.run_id, r.customer_id].some(x => (x || "").toLowerCase().includes(q));
  }
  function renderSeg() {
    put(clear($("#seg")), FILTERS.map(([id, text]) => h("button", { type: "button", "aria-pressed": String(S.filter === id), onclick: () => { S.filter = id; renderSeg(); renderList(); } }, text)));
  }
  function renderList() {
    const rows = S.runs.filter(matches), box = clear($("#items"));
    $("#count").textContent = S.runs.length ? rows.length + " of " + S.runs.length : "";
    if (!S.runs.length) { box.append(h("div", { class: "empty small" }, "No runs yet. Runs from the API, MCP, A2A, the designer's Test run and the CLI appear here as they start.")); return; }
    if (!rows.length) { box.append(h("div", { class: "empty small" }, "No run matches.")); return; }
    for (const r of rows) {
      const who = [r.label, r.surface === "check" ? "test" : r.surface, r.customer_id].filter(Boolean).join(" · ");
      box.append(h("button", { class: "item", type: "button", "aria-current": String(r.run_id === S.id), onclick: () => open(r.run_id) },
        h("span", { class: "lamp " + lampOf(r.status), title: label(r.status) }),
        h("span", null, h("span", { class: "g" }, r.goal || r.run_id), h("span", { class: "m" }, label(r.status) + " · " + ago(r.created_at)), who ? h("span", { class: "m" }, who) : null)));
    }
  }
  async function loadList() {
    try { S.runs = await api("/runs?limit=200"); renderList(); }
    catch (e) { if (e.status === 401 || e.status === 403) gate(e.message); else toast("Runs: " + e.message, 5000); }
  }

  // ---------------------------------------------------------------- one run
  function open(id, keepStep) {
    if (S.id !== id) { S.id = id; S.view = null; S.trace = []; S.sel = keepStep || null; S.stab = null; S.stepSig = ""; S.preview = null; S.opened = {}; }
    history.replaceState(null, "", "#run=" + encodeURIComponent(id) + (S.sel ? "&step=" + encodeURIComponent(S.sel) : ""));
    renderList();
    clear($("#detail")).append(h("div", { class: "panel empty" }, "Loading the run…"));
    refresh(true);
  }
  async function refresh(first) {
    clearTimeout(S.timer);
    const id = S.id;
    if (!id) return;
    try {
      const v = await api("/runs/" + encodeURIComponent(id));
      let tr = [];
      try { tr = await api("/runs/" + encodeURIComponent(id) + "/trace?since=" + S.trace.length); } catch (e) { /* no trace yet */ }
      if (id !== S.id) return;
      S.view = v; S.trace = S.trace.concat(tr || []);
      if (!S.sel || !v.steps.some(s => s.id === S.sel)) S.sel = pickStep(v);
      render(first);
      const row = S.runs.find(r => r.run_id === id);
      if (row && row.status !== v.status) { row.status = v.status; renderList(); }
    } catch (e) {
      if (e.status === 401 || e.status === 403) return gate(e.message);
      if (id === S.id) clear($("#detail")).append(h("div", { class: "panel notice bad" }, "Could not load the run: " + e.message));
      return;
    }
    if (!S.view.settled && S.view.status !== "stalled") {
      const again = () => { if (id !== S.id) return; if (document.hidden) { S.timer = setTimeout(again, 2000); return; } refresh(); };
      S.timer = setTimeout(again, 2000);
    }
  }
  function pickStep(v) {
    const run = v.steps.find(s => s.status === "running"); if (run) return run.id;
    const held = v.steps.find(s => s.status === "needs_approval"); if (held) return held.id;
    const done = v.steps.filter(s => s.result); return (done.length ? done[done.length - 1] : v.steps[0] || {}).id || null;
  }
  function select(sid) { S.sel = sid; S.stab = null; S.stepSig = ""; S.preview = null; history.replaceState(null, "", "#run=" + encodeURIComponent(S.id) + "&step=" + encodeURIComponent(sid)); renderGraphArea(); renderStep(); const p = $("#steppanel"); if (p) p.scrollIntoView({ behavior: "smooth", block: "nearest" }); }

  function render(first) {
    const box = $("#detail");
    if (first || !$("#runhead")) {
      clear(box).append(h("section", { class: "panel", id: "runhead" }), h("section", { class: "panel", id: "graphpanel" }), h("section", { class: "panel", id: "steppanel" }));
    }
    renderHead(); renderGraphArea(); renderStep();
  }
  function stats(v) {
    let calls = 0, tin = 0, tout = 0, files = 0, fails = 0, done = 0;
    for (const s of v.steps) { const r = s.result; if (!r) continue; done++; const m = r.metrics || {}; calls += m.llm_calls || 0; tin += m.input_tokens || 0; tout += m.output_tokens || 0; files += (r.artifacts || []).length; fails += (r.checks || []).filter(c => c.status === "fail").length; }
    return { calls, tin, tout, files, fails, done };
  }
  function times(v) {   // run start and end, from the steps' timing (and the trace's first event)
    let start = null, end = null;
    for (const s of v.steps) { const t = (s.result || {}).timing || {}; const a = ts(t.started_at || s.started_at), b = ts(t.finished_at); if (a && (!start || a < start)) start = a; if (b && (!end || b > end)) end = b; }
    const first = S.trace.length ? ts(S.trace[0].ts) : null; if (first && (!start || first < start)) start = first;
    return { start, end };
  }
  function renderHead() {
    const old = $("#runhead");
    $$("details[data-k]", old).forEach(d => { S.opened = S.opened || {}; S.opened[d.dataset.k] = d.open; });
    const isOpen = (k, dflt) => (S.opened && k in S.opened) ? S.opened[k] : dflt;
    const v = S.view, p = clear(old), st = stats(v), t = times(v), live = !v.settled && v.status !== "stalled";
    const row = S.runs.find(r => r.run_id === v.run_id) || {};
    const took = t.start ? (live ? since(new Date(t.start).toISOString()) : dur(((t.end || Date.now()) - t.start))) : "";
    put(p, h("div", { class: "row", style: "align-items:flex-start;gap:12px" },
      h("div", { class: "grow runhead", style: "min-width:260px" },
        h("div", { class: "row", style: "gap:6px;margin-bottom:6px" },
          h("span", { class: "chip " + runClass(v.status) }, live ? h("span", { class: "lamp run" }) : null, label(v.status)),
          row.label ? h("span", { class: "chip ai" }, row.label) : null,
          v.route && v.route.method ? h("span", { class: "chip", title: v.route.reason || "" }, { explicit: "steps named by the caller", planner: "planned by the model", router: "picked by the router" }[v.route.method] || v.route.method) : null),
        h("h1", null, v.goal || "(no goal)"),
        h("div", { class: "meta", style: "margin-top:6px" },
          h("span", null, "Run ", h("code", null, v.run_id), " ", h("button", { class: "btn sm ghost", type: "button", onclick: () => copy(v.run_id), title: "Copy the run id" }, "copy")),
          t.start ? h("span", null, "started " + when(new Date(t.start).toISOString())) : null,
          took ? h("span", null, live ? "running for " : "took ", took) : null,
          row.customer_id ? h("span", null, "customer ", h("code", null, row.customer_id)) : null,
