<style>
  /* ---------------------------------------------------------------- the frame: top bar, spine, the now band, content */
  html, body { height: 100%; }

  .app { display: grid; grid-template-rows: 58px minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); height: 100vh; }

  .top .search { flex: 1; min-width: 0; max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border: 1px solid var(--rule-2); border-radius: 999px;

  .top .search:hover { border-color: var(--ai); box-shadow: var(--well), var(--ring); } .top .search svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .top .who .chip .name { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* signed out: no frame, one card on the lit page */

  .app.signed-out .frame { grid-template-columns: minmax(0, 1fr); } .app.signed-out .pane { grid-template-rows: minmax(0, 1fr); }

  .flowrow:hover { background: var(--wash); text-decoration: none; } .flowrow .nm { font-weight: 600; font-size: 15px; } .flowrow .ds { color: var(--ink-2); font-size: 13px; margin: 2px 0 8px; max-width: 80ch; }
  .detail-head { display: grid; grid-template-columns: 5px minmax(0, 1fr); gap: 14px; } .detail-head .bar { border-radius: 3px; }
  .kv { grid-template-columns: max-content minmax(0, 1fr); } .kv dd { min-width: 0; overflow-wrap: anywhere; } .kv dd code { display: inline-block; margin: 0 6px 3px 0; }
  .form-grid { display: grid; gap: 10px 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); align-items: start; }
  .drawer-out { white-space: pre-wrap; }

  /* ---------------------------------------------------------------- the assessment and the workshop */
  .feas { border: 1px solid var(--rule-2); border-radius: var(--r-panel); padding: 14px 16px; margin: 18px 0 14px; background: var(--sheen); box-shadow: var(--shadow); }
  .feas.good { border-color: color-mix(in srgb, var(--matsu) 45%, transparent); } .feas.warn { border-color: color-mix(in srgb, var(--kin) 55%, transparent); } .feas.bad { border-color: color-mix(in srgb, var(--shu) 55%, transparent); }
  .feas h3 { font-size: 14px; margin: 0 0 6px; } .feas h4 { font-size: 13px; margin: 10px 0 6px; }
  .reqs { display: grid; gap: 6px; } .req { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 8px; font-size: 13px; align-items: start; } .req .lamp { margin-top: 5px; }
  .gaps { margin-top: 8px; } .gapcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px dashed var(--rule-2); border-radius: var(--r-ctl); margin-bottom: 6px; }
  /* how a customer connects: the four doors, then the chosen door's samples */
  .connect .doors { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .connect .door { display: flex; gap: 10px; align-items: center; text-align: left; padding: 10px 12px; border: 1px solid var(--rule-2); border-radius: var(--r-ctl); background: transparent; color: var(--ink); cursor: pointer; font: inherit; }
  .connect .door svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; color: var(--ink-3); flex-shrink: 0; }
  .connect .door .nm { font-weight: 600; font-size: 13.5px; } .connect .door.on { border-color: var(--ai); background: var(--ai-soft); } .connect .door.on svg { color: var(--ai); }
  .codebox { position: relative; } .codebox pre { padding-right: 64px; max-height: 320px; } .codebox .copy { position: absolute; top: 6px; right: 6px; }
  .democust { padding: 14px 0; border-top: 1px solid var(--rule); } .democust:first-child { border-top: 0; padding-top: 0; } .democust h3 { font-size: 16px; } .democust .walk { padding-left: 20px; margin: 6px 0 10px; } .democust .walk li { margin: 4px 0; }
  .pal.workshop { width: min(920px, calc(100% - 32px)); max-width: 920px; } .workshop .whead { padding: 16px 18px 10px; border-bottom: 1px solid var(--rule); } .workshop .whead h2 { font-size: 18px; }
  .workshop .wbody { padding: 14px 18px 18px; max-height: 74vh; overflow: auto; } .workshop .form-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .workshop input[type=text], .workshop select, .workshop textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--rule-2); border-radius: var(--r-ctl); background: var(--paper); font-size: 13px; outline: none; }
  .workshop input[type=text]:focus, .workshop select:focus, .workshop textarea:focus { border-color: var(--ai); }
  .workshop label.f { gap: 4px; } .workshop .stack > label.f { display: grid; }

  /* ---------------------------------------------------------------- command palette */
  .pal { border: 1px solid var(--rule-2); border-radius: 14px; padding: 0; width: min(680px, calc(100% - 32px)); max-width: 680px; background: var(--sheet); }
  .pal input { width: 100%; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; background: transparent; padding: 16px 18px; font-size: 16px; outline: none; }
  .pal .list { max-height: 60vh; overflow: auto; padding: 6px; } .pal .grp { font-size: 11.5px; color: var(--ink-3); padding: 8px 10px 4px; }
  .pal .it { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .pal .it[aria-selected="true"], .pal .it:hover { background: var(--ai-soft); } .pal .it .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .pal .it .m { font-size: 12px; color: var(--ink-3); }
  .pal .it svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; color: var(--ink-3); }
  .pal .foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--rule); font-size: 11.5px; color: var(--ink-3); }

  /* ---------------------------------------------------------------- phones and narrow screens */
  @media (max-width: 820px) {
    .frame { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .spine { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--rule); padding: 6px 8px; gap: 2px; overflow-x: auto; scrollbar-width: none; }
    .spine a { padding: 6px 10px; white-space: nowrap; border-left: 0; } .spine .gap, .spine .sub { display: none; } .spine a.ext { display: none; }
    .top { gap: 10px; padding: 0 12px; } .top .brand .by { display: none; } .top .search { max-width: none; } .top .search span.ph, .top .search kbd { display: none; } .top .who .name { display: none; }
    .content { padding: 16px 14px 60px; } .now { padding: 0 14px; }
    .goal textarea { font-size: 16px; } .tl .r, .tl .axis { grid-template-columns: 110px 1fr 56px; } .log .e { grid-template-columns: 48px 90px 1fr; }
  }
  @media (max-width: 560px) { .spine a span.lbl { display: none; } .spine a { padding: 8px; } .spine .badge { margin-left: 2px; } .top .who .prov { display: none; } .figures { gap: 16px; } .figure .v { font-size: 22px; } }
</style>
</head>
