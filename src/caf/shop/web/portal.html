<html lang="en">

<link rel="stylesheet" href="{{BASE}}/shop/static/shop.css">
<style>
  /* ---------------------------------------------------------------- the frame: top bar, spine, the now band, content */
  html, body { height: 100%; }
  body { overflow: hidden; }
  .app { display: grid; grid-template-rows: 54px minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); height: 100vh; }
  .top { display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--rule); background: var(--sheet); min-width: 0; }
  .top .brand { flex: none; }
  .top .brand .name { font-size: 14.5px; } .top .brand .by { letter-spacing: 0; text-transform: none; font-size: 11.5px; }
  .top .search { flex: 1; min-width: 0; max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border: 1px solid var(--rule-2); border-radius: 999px;
                 background: var(--paper); color: var(--ink-3); font: inherit; cursor: text; text-align: left; }
  .top .search:hover { border-color: var(--ai); } .top .search svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .top .who .chip .name { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gate { max-width: 440px; margin: 60px auto; } .top .search kbd { margin-left: auto; font: 500 11px var(--mono); padding: 2px 6px; border: 1px solid var(--rule-2); border-radius: 5px; color: var(--ink-3); }
  .top .who { display: flex; align-items: center; gap: 8px; }
  .frame { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 0; }
  .spine { display: flex; flex-direction: column; border-right: 1px solid var(--rule); background: var(--sheet); padding: 12px 10px; gap: 2px; overflow: auto; }
  .spine a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-ctl); color: var(--ink-2); font-weight: 500; border-left: 2px solid transparent; }
  .spine a:hover { background: var(--wash); text-decoration: none; color: var(--ink); }
  .spine a[aria-current="page"] { background: var(--ai-soft); color: var(--ai); border-left-color: var(--ai); }
  .spine a svg { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .spine .badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--kin); color: #1a1200; font-size: 11.5px; font-weight: 600; display: inline-grid; place-items: center; }
  .spine .badge.live { background: var(--ai); color: var(--ai-ink); }
  .spine .gap { flex: 1; } .spine .sub { padding: 10px 10px 4px; font-size: 11.5px; color: var(--ink-3); }
  .spine a.ext { color: var(--ink-3); font-weight: 400; } .spine a.ext svg { width: 14px; height: 14px; margin-left: auto; }
  .pane { display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .now { display: flex; align-items: center; gap: 18px; padding: 0 24px; height: 44px; border-bottom: 1px solid var(--rule); background: color-mix(in srgb, var(--sheet) 60%, var(--paper)); overflow-x: auto; white-space: nowrap; font-size: 13px; }
  .now .item { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); }
  .now a.item:hover { text-decoration: none; color: var(--ink); } .now .item .g { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .now .dots { display: inline-flex; gap: 3px; } .now .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--rule-2); display: inline-block; }
  .now .dots i.good { background: var(--matsu); } .now .dots i.warn { background: var(--kin); } .now .dots i.bad { background: var(--shu); } .now .dots i.run { background: var(--ai); animation: pulse 1.2s ease-in-out infinite; }
  .now .quiet { color: var(--ink-3); } .now .sep { width: 1px; height: 18px; background: var(--rule); flex: none; }
  .content { overflow: auto; padding: 22px 26px 60px; }
  .content > * { max-width: 1360px; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .now .dots i.run, .lamp.run, .gnode.running::after { animation: none !important; } }

  /* ---------------------------------------------------------------- building blocks */
  h1.page { font-size: 24px; margin-bottom: 4px; } .page-lead { color: var(--ink-2); max-width: 70ch; margin-bottom: 18px; }
  .section { margin-top: 26px; } .section > h2 { font-size: 16px; margin-bottom: 10px; display: flex; align-items: baseline; gap: 10px; } .section > h2 .muted { font-size: 13px; font-weight: 400; }
  .cols { display: grid; gap: 22px; grid-template-columns: minmax(0, 1.4fr) minmax(300px, 1fr); align-items: start; }
  .cols > *, .stack-lg > *, .stack > *, .content section { min-width: 0; }
  @media (max-width: 1020px) { .cols { grid-template-columns: 1fr; } }
  .lamp.run { background: var(--ai); animation: pulse 1.2s ease-in-out infinite; } .lamp.off { background: var(--rule-2); }
  .chip.live { background: var(--ai-soft); color: var(--ai); border-color: transparent; }
  .rows { display: grid; } .rows .r { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 6px; border-bottom: 1px solid var(--rule); color: inherit; }
  .rows a.r:hover { background: var(--wash); text-decoration: none; } .rows .r .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .rows .r .m { font-size: 12.5px; color: var(--ink-3); }
  .rows .r .lamp { margin-top: 1px; } .rows .r .end { font-size: 12.5px; color: var(--ink-3); text-align: right; white-space: nowrap; }

  .figure .v small { font-size: 14px; font-weight: 500; color: var(--ink-3); margin-left: 4px; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 64px; } .bars .d { flex: 1; display: flex; flex-direction: column-reverse; gap: 1px; min-width: 6px; border-radius: 3px 3px 0 0; overflow: hidden; }
  .bars .d i { display: block; } .bars .d i.ok { background: var(--matsu); } .bars .d i.bad { background: var(--shu); } .bars .d i.open { background: var(--ai); } .bars .d.none { border-bottom: 2px solid var(--rule-2); }
  .bars .d:hover { outline: 1px solid var(--rule-2); }
  .axis { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; } .seg button { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--rule-2); background: transparent; cursor: pointer; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--ai-soft); color: var(--ai); border-color: var(--ai); } .seg button .n { color: var(--ink-3); margin-left: 4px; }

  .tw { overflow-x: auto; max-width: 100%; }

  .tag { font: 600 10px/1 var(--mono); letter-spacing: .05em; color: var(--ai); background: var(--ai-soft); padding: 3px 5px; border-radius: 4px; }
  .stripe { width: 4px; align-self: stretch; border-radius: 3px; flex: none; }
  .steprow { display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 10px; align-items: stretch; }

  /* ---------------------------------------------------------------- the goal box (launch) */
  .goal { border: 1px solid var(--rule-2); border-radius: var(--r-hero); background: var(--sheet); padding: 18px 20px 14px; position: relative; }
  .goal:focus-within { border-color: var(--ai); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ai) 25%, transparent); }
  .goal textarea { width: 100%; min-height: 84px; resize: vertical; border: 0; background: transparent; padding: 0; font: 500 19px/1.4 var(--font); color: var(--ink); outline: none; }
  .goal textarea::placeholder { color: var(--ink-3); font-weight: 400; }
  .goal .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--rule); }
  .goal .bar select { width: auto; max-width: 320px; padding: 6px 10px; }
  .examples { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; } .examples button { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--rule-2); background: transparent; color: var(--ink-2); cursor: pointer; }
  .examples button:hover { border-color: var(--ai); color: var(--ai); }
  .inputs-grid { display: grid; gap: 10px 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); margin-top: 12px; }
  .plan-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 18px 0 10px; }

  /* ---------------------------------------------------------------- the graph: the one picture of a flow, planned or live */
  .graph { position: relative; overflow: auto; max-height: 480px; min-height: 120px; border: 1px solid var(--rule); border-radius: var(--r-panel);
           background: radial-gradient(color-mix(in srgb, var(--rule) 80%, transparent) 1px, transparent 1px) 0 0 / 18px 18px, var(--paper); }
  .graph svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .gnode { position: absolute; width: 224px; height: 62px; display: grid; grid-template-columns: 4px 1fr; background: var(--sheet); border: 1px solid var(--rule-2); border-radius: 10px;
           text-align: left; padding: 0; font: inherit; color: inherit; cursor: pointer; transition: border-color .15s; }
  .gnode:hover { border-color: var(--ai); } .gnode .bar { border-radius: 9px 0 0 9px; } .gnode .body { padding: 8px 11px; min-width: 0; }
  .gnode .nm { font-weight: 600; font-size: 13px; line-height: 1.25; display: flex; align-items: center; gap: 6px; } .gnode .nm span.t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gnode .sub { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gnode .act { font-size: 11.5px; color: var(--ai); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gnode.sel { border-color: var(--ai); box-shadow: 0 0 0 2px var(--ai); }
  .gnode.running { border-color: var(--ai); box-shadow: 0 0 0 1px var(--ai), 0 0 28px rgba(var(--glow), .35); }
  .gnode.pending, .gnode.skipped { opacity: .62; } .gnode.pending.sel, .gnode.skipped.sel { opacity: 1; }
  .gnode.not-entitled { border-style: dashed; opacity: .7; }
  .graph .particle { fill: var(--ai); }
  .graph.planned .gnode { cursor: default; }
  .mini { display: inline-flex; gap: 3px; align-items: center; } .mini i { width: 8px; height: 8px; border-radius: 50%; background: var(--rule-2); display: inline-block; }
  .mini i.good { background: var(--matsu); } .mini i.warn { background: var(--kin); } .mini i.bad { background: var(--shu); } .mini i.run { background: var(--ai); animation: pulse 1.2s ease-in-out infinite; }

  /* ---------------------------------------------------------------- run viewer */
  .runhead { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; } .runhead h1 { font-size: 22px; line-height: 1.25; }
  .meta { color: var(--ink-3); font-size: 12.5px; display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; margin-top: 6px; } .meta code { font-size: 12px; }
  .held { border: 1px solid color-mix(in srgb, var(--kin) 50%, transparent); background: var(--kin-soft); border-radius: var(--r-panel); padding: 12px 14px; margin-top: 14px; }
  .held .a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid color-mix(in srgb, var(--kin) 30%, transparent); }
  .held .a:first-of-type { border-top: 0; }
  .tl { display: grid; gap: 4px; font-size: 12.5px; } .tl .r { display: grid; grid-template-columns: 220px 1fr 76px; gap: 10px; align-items: center; cursor: pointer; border-radius: 4px; padding: 2px 4px; }
  .tl .r:hover, .tl .r.sel { background: var(--wash); } .tl .lab { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .tl .track { position: relative; height: 14px; background: var(--wash); border-radius: 3px; }
  .tl .bar { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--matsu); min-width: 3px; } .tl .bar.warn { background: var(--kin); } .tl .bar.bad { background: var(--shu); } .tl .bar.run { background: var(--ai); }
  .tl .axis { display: grid; grid-template-columns: 220px 1fr 76px; gap: 10px; color: var(--ink-3); font-size: 11.5px; padding: 0 4px; margin: 0; } .tl .axis .ticks { display: flex; justify-content: space-between; }
  .log { max-height: 420px; overflow: auto; font-size: 12.5px; display: grid; } .log .e { display: grid; grid-template-columns: 62px 150px 1fr; gap: 10px; padding: 3px 4px; border-bottom: 1px solid var(--rule); }
  .log .e .t { color: var(--ink-3); font-variant-numeric: tabular-nums; } .log .e .w { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log .e.model .d { color: var(--ai); } .log .e.bad .d { color: var(--shu); } .log .e.good .d { color: var(--matsu); }
  .stephead { display: grid; grid-template-columns: 4px 1fr; gap: 12px; } .stephead .bar { border-radius: 3px; }
  .bind td:first-child { white-space: nowrap; } .bind code { font-size: 12px; }
  .src { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; } .src .chip.used { background: var(--matsu-soft); color: var(--matsu); border-color: transparent; } .src button.chip { cursor: pointer; } .src button.chip:hover { border-color: var(--ai); }
  .val { white-space: pre-wrap; word-break: break-word; max-width: 520px; }
  .jt { font-family: var(--mono); font-size: 12px; line-height: 1.55; } .jt details { padding-left: 14px; } .jt summary { cursor: pointer; margin-left: -14px; list-style: none; }
  .jt summary::before { content: "▸ "; color: var(--ink-3); } .jt details[open] > summary::before { content: "▾ "; }
  .jt .k { color: var(--ink-2); } .jt .s { color: var(--matsu); white-space: pre-wrap; word-break: break-word; } .jt .n { color: var(--ai); } .jt .b { color: var(--kin); } .jt .z { color: var(--ink-3); } .jt .row { padding-left: 14px; display: block; } .jt .c { color: var(--ink-3); }
  .md p { margin: 0 0 6px; } .md ul { margin: 0 0 6px; padding-left: 18px; } .md h3, .md h4 { margin: 8px 0 4px; font-size: 14px; color: var(--ink); }
  .files .f { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--rule); }
  .preview iframe { width: 100%; height: 520px; border: 1px solid var(--rule); border-radius: var(--r-ctl); background: #fff; } .preview img { max-width: 100%; border: 1px solid var(--rule); border-radius: var(--r-ctl); } .preview pre { max-height: 520px; }
  .runs-layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 1020px) { .runs-layout { grid-template-columns: 1fr; } }
  .runlist { position: sticky; top: 0; max-height: calc(100vh - 150px); display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  .runlist .head { padding: 12px 12px 10px; display: grid; gap: 8px; border-bottom: 1px solid var(--rule); } .runlist .items { overflow: auto; flex: 1; }
  .runlist .day { font-size: 11.5px; color: var(--ink-3); padding: 10px 12px 4px; }
  .item { display: grid; grid-template-columns: 10px 1fr; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--rule); cursor: pointer; background: none; border-left: 2px solid transparent; width: 100%; text-align: left; border-top: 0; border-right: 0; color: inherit; font: inherit; }
  .item:hover { background: var(--wash); } .item[aria-current="true"] { background: var(--ai-soft); border-left-color: var(--ai); }
  .item .g { font-weight: 500; font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } .item .m { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; } .item .lamp { margin-top: 5px; }
  @media (max-width: 1020px) { .runlist { position: static; max-height: 320px; } }

  /* ---------------------------------------------------------------- agents and flows */
  .tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .tile { display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 11px; padding: 10px 12px 10px 10px; border: 1px solid var(--rule); border-radius: 10px; background: var(--sheet); color: inherit; text-align: left; font: inherit; cursor: pointer; }
  .tile:hover { border-color: var(--ai); text-decoration: none; } .tile .nm { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 6px; } .tile .nm .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .sm { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile .ft { margin-top: 6px; display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--ink-3); }
  .catbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 1px; } .catbar i { display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-top: 8px; } .legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }
  .stages { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; } .stages .stage { display: grid; gap: 3px; } .stages .step { font-size: 11.5px; padding: 2px 8px; border-radius: 4px; background: var(--ai-soft); color: var(--ai); white-space: nowrap; } .stages .arrow { color: var(--ink-3); }
  .flowrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--rule); color: inherit; }
  .flowrow:hover { background: var(--wash); text-decoration: none; } .flowrow .nm { font-weight: 600; font-size: 15px; } .flowrow .ds { color: var(--ink-2); font-size: 13px; margin: 2px 0 8px; max-width: 80ch; }
  .detail-head { display: grid; grid-template-columns: 5px minmax(0, 1fr); gap: 14px; } .detail-head .bar { border-radius: 3px; }
  .kv { grid-template-columns: max-content minmax(0, 1fr); } .kv dd { min-width: 0; overflow-wrap: anywhere; } .kv dd code { display: inline-block; margin: 0 6px 3px 0; }
  .form-grid { display: grid; gap: 10px 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .drawer-out { white-space: pre-wrap; }

  /* ---------------------------------------------------------------- command palette */
  .pal { border: 1px solid var(--rule-2); border-radius: 14px; padding: 0; width: min(680px, calc(100% - 32px)); background: var(--sheet); }
  .pal input { width: 100%; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; background: transparent; padding: 16px 18px; font-size: 16px; outline: none; }
  .pal .list { max-height: 60vh; overflow: auto; padding: 6px; } .pal .grp { font-size: 11.5px; color: var(--ink-3); padding: 8px 10px 4px; }
  .pal .it { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .pal .it[aria-selected="true"], .pal .it:hover { background: var(--ai-soft); } .pal .it .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .pal .it .m { font-size: 12px; color: var(--ink-3); }
  .pal .it svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; color: var(--ink-3); }
  .pal .foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--rule); font-size: 11.5px; color: var(--ink-3); }

  /* ---------------------------------------------------------------- phones and narrow screens */
  @media (max-width: 820px) {
    .frame { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .spine { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--rule); padding: 6px 8px; gap: 2px; overflow-x: auto; scrollbar-width: none; }
    .spine a { padding: 6px 10px; white-space: nowrap; border-left: 0; } .spine .gap, .spine .sub { display: none; } .spine a.ext { display: none; }
    .top { gap: 10px; padding: 0 12px; } .top .brand .by { display: none; } .top .search { max-width: none; } .top .search span.ph, .top .search kbd { display: none; } .top .who .name { display: none; }
    .content { padding: 16px 14px 60px; } .now { padding: 0 14px; }
    .goal textarea { font-size: 16px; } .tl .r, .tl .axis { grid-template-columns: 110px 1fr 56px; } .log .e { grid-template-columns: 48px 90px 1fr; }
  }
  @media (max-width: 560px) { .spine a span.lbl { display: none; } .spine a { padding: 8px; } .spine .badge { margin-left: 2px; } .top .who .prov { display: none; } .figures { gap: 16px; } .figure .v { font-size: 22px; } }
</style>
</head>
<body data-product="{{PRODUCT}}" data-company="{{COMPANY}}">
<div class="app" id="app">
  <header class="top" id="top"></header>
