  function detailPanel() {

          h("button", { class: "btn sm " + (c.status === "active" ? "danger" : ""), type: "button", onclick: async () => { await api("/shop/admin/api/customers/" + c.id, { method: "PATCH", body: { status: c.status === "active" ? "suspended" : "active" } }); select(c.id); } }, c.status === "active" ? "Suspend" : "Activate"))),

      { subscriptions: subsTab, keys: keysTab, policy: policyTab, check: checkTab, usage: usageTab, connect: connectTab }[tab](c));

  function subsTab(c) {

      [["blueprint", "Marketing blueprint"], ...(catalog.packs || []).map(p => [p.id, p.name])].map(([pid, pname]) => { const rows = catalog.agents.filter(a => (a.pack || "blueprint") === pid);
        return rows.length ? h("details", { open: pid === "blueprint" || rows.some(a => current.has("agent:" + a.id)) }, h("summary", { style: "cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2);margin:4px 0 8px" }, "Single agents · " + pname + " (" + rows.length + ")"),
          h("div", { class: "checkgrid" }, rows.map(a => box("agent", a.id, a.name, pid === "blueprint" ? "" : a.accelerator)))) : null; }),

  async function changeMode(c, mode) {

      h("div", { class: "row" }, h("button", { class: "btn primary", type: "button", onclick: async () => { let body; try { body = JSON.parse(ta.value); } catch (e) { return toast("Not valid JSON: " + e.message, 4000); }

          pendingModel = false; toast("Policy saved · run mode " + r.run_mode + (r.run_mode === MODE2 ? " · run Agent check to try their model" : ""), 5000); select(c.id); } catch (err) { toast(err.message, 6000); } } }, "Save policy")));

      h("table", null, h("thead", null, h("tr", null, h("th", null, "Agent"), h("th", null, "Status"), h("th", { class: "num" }, "Model calls"), h("th", { class: "num" }, "Seconds"), h("th", null, "Note"))),
        h("tbody", null, r.agents.map(a => h("tr", null, h("td", null, a.name || a.agent_id), h("td", null, statusChip(a.status)), h("td", { class: "num" }, String(a.llm_calls || 0)), h("td", { class: "num" }, (a.duration_ms / 1000).toFixed(1)), h("td", { class: "xs muted" }, a.error || (a.degraded_reasons || []).join("; "))))))); };

      h("p", { class: "small muted" }, "Runs the self-test of every subscribed agent on this customer's model (its policy), records the usage and keeps the result on the customer. Live model cost applies."),
      h("div", { class: "row" }, h("button", { class: "btn primary", type: "button", onclick: async (e) => { e.target.disabled = true; e.target.textContent = "Checking… this takes a few minutes";

  function usageTab(c) {

  // ------------------------------------------------------------------------------------------ flows (composed in the designer)
  function stageStrip(steps, stages) {
    const strip = h("div", { class: "stages" });
    const shown = (stages || []).slice(0, 6);
    shown.forEach((stage, i) => {
      if (i) strip.append(h("span", { class: "arrow" }, "→"));
      strip.append(h("div", { class: "stage" }, stage.slice(0, 4).map(id => { const s = steps.find(x => x.id === id); return h("span", { class: "step", title: id + (s ? " · " + s.agent : "") }, s ? agentName(s.agent) : id); }),
        stage.length > 4 ? h("span", { class: "xs muted" }, "+" + (stage.length - 4) + " more") : null));
    });
    if ((stages || []).length > shown.length) strip.append(h("span", { class: "xs muted" }, "… " + (stages.length - shown.length) + " more stages"));

  const designer = (id) => BASE + "/shop/designer" + (id ? "#flow=" + id : "");

        mine ? h("a", { class: "btn sm primary right", href: designer() }, "New flow in the designer") : null),
      rows.length ? h("table", null, h("thead", null, h("tr", null, h("th", null, "Flow"), h("th", null, "Runs as"), h("th", null, "Status"), h("th", { class: "num" }, "Rented by"), h("th", null, ""))),
        h("tbody", null, rows.map(f => h("tr", null,
          h("td", null, h("strong", null, f.name), h("div", { class: "xs muted mono" }, f.id + " · v" + f.version + " · " + f.steps.length + " steps"), f.description ? h("div", { class: "xs muted" }, f.description.slice(0, 160)) : null),
          h("td", null, stageStrip(f.steps, f.stages)),

            f.source === "custom" ? h("button", { class: "btn sm " + (f.status === "published" ? "" : "primary"), type: "button", onclick: () => publishFlow(f.id, f.status !== "published") }, f.status === "published" ? "Unpublish" : "Publish") : null,
            f.source === "custom" ? h("button", { class: "btn sm danger", type: "button", onclick: () => deleteFlow(f) }, "Delete") : null))))))
        : h("p", { class: "muted" }, "None yet. Open the designer, put agents on the canvas, connect them and publish."));
  }
  function flowsHelpPanel() {
    return h("section", { class: "panel stack" }, h("h4", null, "How a flow is rented"),
      h("p", { class: "small" }, h("strong", null, "Design"), " it on the canvas: agents as steps, a line from each step to the ones that run after it. Check it, test it, publish it."),
      h("p", { class: "small" }, h("strong", null, "Publish"), " lists the flow on the storefront and creates its MCP tool ", h("code", null, "run_flow_<id>"), ", the endpoint ", h("code", null, "POST /flows/<id>/run"), " and the A2A skill ", h("code", null, "flow:<id>"), "."),
      h("p", { class: "small" }, h("strong", null, "Subscribe"), " a customer to the flow on its Subscriptions tab. Renting a flow lets the customer run the whole flow; agents stay separately rentable."),
      h("a", { class: "btn primary", href: designer() }, "Open the designer"));
  }
  function packsPanel() {
    const packs = catalog.packs || [];
    return h("section", { class: "panel stack" }, h("h4", null, "Where the agents come from"),
      h("div", { class: "row small" }, h("span", { class: "grow" }, "Marketing blueprint"), h("span", { class: "muted" }, catalog.agents.filter(a => (a.pack || "blueprint") === "blueprint").length + " agents")),
      packs.map(p => h("div", { class: "stack", style: "gap:2px" }, h("div", { class: "row small" }, h("span", { class: "grow" }, p.name), h("span", { class: "muted" }, p.agents + " agents · " + p.flows + " flows")),

  }
