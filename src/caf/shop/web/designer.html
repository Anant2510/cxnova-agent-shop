<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Designer · {{PRODUCT}}</title>
<link rel="icon" href="{{BASE}}/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{BASE}}/shop/static/shop.css">
<style>
  /* The designer: agents on the left, the flow on a canvas, the selected step on the right. */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .topbar { position: static; flex: none; }
  .flowbar { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--sheet); border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .flowbar .title { font-weight: 600; font-size: 15px; max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .flowbar .id { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
  .flowbar .spacer { flex: 1; }
  .work { flex: 1; min-height: 0; display: grid; grid-template-columns: 272px minmax(0, 1fr) 336px; }
  .side { background: var(--sheet); overflow: auto; }
  .side.left { border-right: 1px solid var(--rule); }
  .side.right { border-left: 1px solid var(--rule); }
  .side .pad { padding: 12px 14px; }
  .side h3 { font-size: 13px; }
  @media (max-width: 1000px) { body { overflow: auto; } .work { grid-template-columns: 1fr; } .side { max-height: 46vh; } #stage { height: 62vh; } }

  /* palette */
  .pal-search { position: sticky; top: 0; background: var(--sheet); padding: 12px 14px 8px; z-index: 2; border-bottom: 1px solid var(--rule); }
  .pack > summary { list-style: none; cursor: pointer; padding: 9px 14px; font-weight: 600; font-size: 13px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--rule); background: var(--wash); position: sticky; top: 53px; z-index: 1; }
  .pack > summary::-webkit-details-marker { display: none; }
  .pack > summary .n { margin-left: auto; font-weight: 400; color: var(--ink-3); font-size: 12px; }
  .pack > summary::before { content: "▸"; color: var(--ink-3); font-size: 11px; }
  .pack[open] > summary::before { content: "▾"; }
  .group-name { padding: 8px 14px 2px; font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
  .pal-item { display: grid; grid-template-columns: 4px 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 6px 12px 6px 14px; cursor: grab; color: var(--ink); }
  .pal-item:hover, .pal-item:focus-visible { background: var(--ai-soft); }
  .pal-item .bar { width: 4px; height: 26px; border-radius: 2px; }
  .pal-item .nm { font-size: 13px; line-height: 1.25; }
  .pal-item .sub { font-size: 11px; color: var(--ink-3); display: block; }
  .pal-item .plus { color: var(--ai); font-weight: 600; opacity: 0; }
  .pal-item .tag { font: 600 9.5px/1 var(--mono); letter-spacing: .06em; color: var(--ai); border: 1px solid var(--ai-soft); background: var(--ai-soft); padding: 3px 5px; border-radius: 4px; }
  .pack > summary .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
  .pal-item:hover .plus, .pal-item:focus-visible .plus { opacity: 1; }

  /* canvas */
  #stage { position: relative; overflow: hidden; background-color: var(--paper); background-image: radial-gradient(var(--rule-2) 1px, transparent 1px); background-size: 22px 22px; cursor: default; touch-action: none; }
  #stage.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #wires path.wire { fill: none; stroke: var(--ink-3); stroke-width: 1.6; pointer-events: stroke; cursor: pointer; }
  #wires path.hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
  #wires path.wire.sel { stroke: var(--ai); stroke-width: 2.6; }
  #wires path.temp { fill: none; stroke: var(--ai); stroke-width: 2; stroke-dasharray: 5 4; }
  .node { position: absolute; width: 224px; background: var(--sheet); border: 1px solid var(--rule-2); border-radius: 8px; box-shadow: var(--shadow); cursor: grab; user-select: none; display: grid; grid-template-columns: 5px 1fr; }
  .node .bar { border-radius: 7px 0 0 7px; }
  .node .body { padding: 8px 10px 9px; min-width: 0; }
  .node .nm { font-weight: 600; font-size: 13px; line-height: 1.25; display: flex; gap: 6px; align-items: flex-start; }
  .node .nm span.t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .node .meta { font-size: 11px; color: var(--ink-3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .meta code { font-size: 11px; }
  .node .act { font-size: 11px; color: var(--ai); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node.sel { border-color: var(--ai); box-shadow: 0 0 0 2px var(--ai-soft), var(--shadow); }
  .node.target { border-color: var(--ai); background: var(--ai-soft); }
  .node.ro { cursor: default; }
  .port { position: absolute; top: 50%; width: 13px; height: 13px; margin-top: -7px; border-radius: 50%; background: var(--sheet); border: 2px solid var(--ink-3); }
  .port.in { left: -7px; }
  .port.out { right: -7px; cursor: crosshair; }
  .port.out:hover { border-color: var(--ai); background: var(--ai); }
  .canvas-tools { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 4px; box-shadow: var(--shadow); }
  .canvas-hint { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); text-align: center; color: var(--ink-3); max-width: 420px; pointer-events: none; }
  .canvas-hint strong { display: block; color: var(--ink-2); font-size: 16px; margin-bottom: 6px; }
  .problems { position: absolute; left: 12px; bottom: 12px; max-width: min(560px, calc(100% - 220px)); }

  /* inspector */
  .insp label.f { margin-bottom: 10px; }
  .insp .rowline { display: flex; gap: 6px; align-items: center; }
  .insp table input[type=text] { padding: 4px 6px; font-size: 12.5px; }
  .insp .bind { display: grid; grid-template-columns: 1fr; gap: 3px; margin-bottom: 8px; }
  .insp .bind .k { font-size: 12px; color: var(--ink-2); display: flex; gap: 6px; align-items: baseline; }
  .insp .bind .k code { font-size: 12px; }
  .insp .bind input { font-family: var(--mono); font-size: 12px; padding: 5px 7px; }
  .insp hr { border: 0; border-top: 1px solid var(--rule); margin: 14px 0; }
  .chiplist { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip button { border: 0; background: none; cursor: pointer; color: inherit; padding: 0 0 0 2px; font-size: 12px; }
  dialog .list { max-height: 60vh; overflow: auto; display: grid; gap: 2px; }
  dialog .list button { text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 8px; color: var(--ink); }
  dialog .list button:hover { background: var(--ai-soft); }
  dialog .list .grp { font-size: 11.5px; color: var(--ink-3); font-weight: 600; padding: 10px 10px 2px; }
</style>
</head>
<body data-product="{{PRODUCT}}" data-company="{{COMPANY}}">
<div id="top"></div>
<div class="flowbar" id="flowbar"></div>
<div class="work">
  <aside class="side left" id="palette" aria-label="Agents"></aside>
  <div id="stage" aria-label="Flow canvas">
    <div id="world"><svg id="wires" width="10" height="10" aria-hidden="true"></svg></div>
    <div class="canvas-hint" id="hint"></div>
    <div class="problems" id="problems"></div>
    <div class="canvas-tools" id="tools"></div>
  </div>
  <aside class="side right insp" id="inspector" aria-label="Step and flow settings"></aside>
</div>
<dialog id="dlg"></dialog>
<script src="{{BASE}}/shop/static/shop.js"></script>
<script>
(function () {
  const { h, $, $$, clear, toast, money, catColor, topbar, BASE } = Shop;
  $("#top").replaceWith(topbar("designer"));
  const KEY = "cxnova.shop.admin";
  const getTok = () => { try { return localStorage.getItem(KEY) || ""; } catch (e) { return ""; } };
  const setTok = (t) => { try { t ? localStorage.setItem(KEY, t) : localStorage.removeItem(KEY); } catch (e) {} };
  const api = (path, opts) => Shop.api(path, Object.assign({ token: getTok() }, opts || {}));
  const NODE_W = 224, COL = 300, ROW = 104;
  const S = { agents: [], byId: {}, packs: [], flows: [], flow: null, isNew: true, readOnly: false, dirty: false, sel: null,
              view: { x: 40, y: 30, k: 1 }, test: null, problems: null, details: {}, q: "" };
  const stage = $("#stage"), world = $("#world"), wires = $("#wires");

  // ---------------------------------------------------------------- small helpers
  // append children the way h() does: arrays flattened, null and false left out (Element.append would print them)
  function put(el, ...kids) { for (const c of kids.flat(Infinity)) { if (c === null || c === undefined || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); } return el; }
  const agent = (id) => S.byId[id] || { id, name: id.replace(/_/g, " "), category: "", pack_name: "", actions: [] };
  const step = (id) => S.flow.steps.find(s => s.id === id);
  const pos = (id) => S.flow.layout[id] || (S.flow.layout[id] = { x: 60, y: 60 });
  function dialog(title, body) {
    const d = $("#dlg");
    clear(d).append(h("div", { class: "stack" }, h("div", { class: "row" }, h("h2", null, title), h("button", { class: "btn sm ghost right", type: "button", onclick: () => d.close() }, "Close")), body));
    d.showModal();
    return d;
  }
  function ask(title, label, value, hint) {   // one text answer, in the page (no browser prompt); null when closed without one
    return new Promise((resolve) => {
      const d = $("#dlg"), input = h("input", { type: "text", value: value || "" });
      let done = false;
      const finish = (v) => { if (done) return; done = true; d.removeEventListener("cancel", onCancel); if (d.open) d.close(); resolve(v); };
      const onCancel = () => finish(null);   // Esc
      clear(d).append(h("form", { class: "stack", onsubmit: (e) => { e.preventDefault(); finish(input.value.trim() || null); } },
        h("div", { class: "row" }, h("h2", null, title), h("button", { class: "btn sm ghost right", type: "button", onclick: () => finish(null) }, "Close")),
        h("label", { class: "f" }, label, input), hint ? h("p", { class: "xs muted" }, hint) : h("span"),
        h("div", { class: "row" }, h("button", { class: "btn primary", type: "submit" }, "OK"))));
      d.addEventListener("cancel", onCancel);
      d.showModal();
      setTimeout(() => { input.focus(); input.select(); }, 0);
    });
  }
  function touch() { S.dirty = true; S.problems = null; renderBar(); }
  function uniqueStepId(agentId, self) {
    const ids = new Set(S.flow.steps.filter(s => s !== self).map(s => s.id));
    const base = agentId.replace(/^(cs|arm)_/, "").replace(/^(factory|sitecore)_/, "").split("_").slice(0, 2).join("_").slice(0, 24) || "step";
    let id = base, n = 2;
    while (ids.has(id)) id = base + "_" + n++;
    return id;
  }
  function levels() {   // the stage each step runs in: one after the last step it needs
    const lv = {}, visiting = new Set();
    const of = (id) => { if (lv[id]) return lv[id]; if (visiting.has(id)) return 1; visiting.add(id); const s = step(id); const v = 1 + Math.max(0, ...(s ? s.needs : []).filter(n => step(n)).map(of)); visiting.delete(id); return (lv[id] = v); };
    S.flow.steps.forEach(s => of(s.id));
    return lv;
  }
  function ordered() {   // dependency order for saving: by stage, then top to bottom on the canvas
    const lv = levels();
    return S.flow.steps.slice().sort((a, b) => lv[a.id] - lv[b.id] || pos(a.id).y - pos(b.id).y || pos(a.id).x - pos(b.id).x);
  }
  function reaches(from, to) {   // does `to` already depend on `from` (directly or not)?
    const seen = new Set(), walk = (id) => { if (id === from) return true; if (seen.has(id)) return false; seen.add(id); const s = step(id); return !!s && s.needs.some(walk); };
    return walk(to);
  }

  // ---------------------------------------------------------------- loading
  function gate(message) {
    $("#flowbar").style.display = "none"; $(".work").style.display = "none";
    const box = h("main", { class: "wrap", id: "gate" }, h("section", { class: "panel gate stack" },
      h("h1", { style: "font-size:20px" }, "Orchestration designer"),
      h("p", { class: "muted small" }, "Composing and publishing flows is the operator's job: enter this server's operator token (CAF_API_TOKEN). On the server itself, with no token configured, press Open."),
      message ? h("div", { class: "notice warn" }, message) : null,
      h("form", { class: "stack", onsubmit: (e) => { e.preventDefault(); setTok($("#tok").value.trim()); $("#gate").remove(); load(); } },
        h("label", { class: "f" }, "Operator token", h("input", { type: "password", id: "tok", autocomplete: "off" })),
        h("button", { class: "btn primary", type: "submit" }, "Open"))));
    document.body.insertBefore(box, $("#dlg"));
  }
  async function load() {
    try {
      const [cat, flows] = await Promise.all([Shop.api("/shop/catalog", { token: "" }), api("/shop/admin/api/flows")]);
      S.agents = cat.agents; S.packs = cat.packs || []; S.flows = flows;
      S.byId = Object.fromEntries(cat.agents.map(a => [a.id, a]));
    } catch (e) { setTok(""); return gate(e.status === 401 || e.status === 403 ? "Not accepted: " + e.message : "Could not load: " + e.message); }
    $("#flowbar").style.display = ""; $(".work").style.display = "";
    const want = /[#&]flow=([a-z0-9_]+)/.exec(location.hash), draft = /[#&]draft=([A-Za-z0-9_-]+)/.exec(location.hash);
    if (draft) { try { const b = draft[1].replace(/-/g, "+").replace(/_/g, "/"); newFlow(JSON.parse(decodeURIComponent(escape(atob(b + "===".slice((b.length + 3) % 4)))))); history.replaceState(null, "", location.pathname); } catch (e) { newFlow(); toast("Could not read the plan handed over by the console", 4000); } }
    else if (want && S.flows.some(f => f.id === want[1])) openFlow(want[1]);
    else newFlow();
    renderPalette();
  }
  function setFlow(f, opts) {
    S.flow = f; S.isNew = !!opts.isNew; S.readOnly = !!opts.readOnly; S.dirty = !!opts.dirty; S.sel = null; S.test = null; S.problems = null;
    f.layout = f.layout || {};
    if (f.steps.some(s => !f.layout[s.id])) arrange(false);
    renderAll(); fit();
  }
  function newFlow(draft) {
    const known = draft ? (draft.steps || []).filter(s => S.byId[s.agent]) : [];
    setFlow({ id: "", name: (draft && draft.name) || "", description: (draft && draft.description) || "", triggers: [], price: null, status: "draft", source: "custom", layout: {},
      inputs: draft && draft.inputs && draft.inputs.length ? draft.inputs.filter(i => i && i.name) : [{ name: "url", description: "The page or site to work from", required: false, example: "" }],
      steps: known.map(s => ({ id: String(s.id || s.agent), agent: s.agent, purpose: s.purpose || "", inputs: s.inputs || {}, needs: (s.needs || []).map(String) })) }, { isNew: true, dirty: !!draft });
    history.replaceState(null, "", location.pathname);
  }
  function openFlow(id) {
    const f = S.flows.find(x => x.id === id);
    if (!f) return toast("No flow " + id);
    setFlow(JSON.parse(JSON.stringify({ id: f.id, name: f.name, description: f.description || "", inputs: f.inputs || [], triggers: f.triggers || [], price: f.price_override || null, status: f.status, source: f.source,
      pack_name: f.pack_name, version: f.version, layout: f.layout || {}, steps: f.steps.map(s => ({ id: s.id, agent: s.agent, purpose: s.purpose || "", inputs: s.inputs || {}, needs: s.needs || [] })) })),
      { isNew: false, readOnly: f.source === "builtin" });
    history.replaceState(null, "", location.pathname + "#flow=" + f.id);
  }
  async function refreshFlows() { S.flows = await api("/shop/admin/api/flows"); }

  // ---------------------------------------------------------------- the flow bar
  function renderBar() {
    const f = S.flow, ro = S.readOnly;
    const chip = (text, cls) => h("span", { class: "chip " + cls }, text);
    put(clear($("#flowbar")), 
      h("button", { class: "btn sm", type: "button", onclick: openDialog }, "Open"),
      h("button", { class: "btn sm", type: "button", onclick: () => guard(() => newFlow()) }, "New"),
      h("span", { class: "title", title: f.name }, f.name || "Untitled flow"), f.id ? h("span", { class: "id" }, f.id + (f.version ? " · v" + f.version : "")) : null,
      ro ? chip(f.pack_name ? f.pack_name + " · read-only" : "built-in · read-only", "") : chip(f.status, f.status === "published" ? "good" : "warn"),
      S.dirty && !ro ? chip("unsaved changes", "ai") : null,
      h("span", { class: "muted small" }, f.steps.length + " steps · " + stageCount() + " stages"),
      h("span", { class: "spacer" }),
      h("button", { class: "btn sm", type: "button", onclick: check, disabled: !f.steps.length }, "Check"),
      h("button", { class: "btn sm", type: "button", onclick: testRun, disabled: !f.steps.length, title: "Runs every step once with sample inputs on this server's model" }, S.test && S.test.running ? "Running…" : "Test run"),
      S.test && S.test.run_id ? h("a", { class: "btn sm ghost", href: BASE + "/shop/runs#run=" + encodeURIComponent(S.test.run_id), target: "_blank", rel: "noopener",
        title: "Each step's inputs, output, files and model calls, live" }, S.test.running ? "Watch live ↗" : "View run ↗") : null,
      ro ? h("button", { class: "btn sm primary", type: "button", onclick: cloneFlow }, "Clone to edit") : [
        h("button", { class: "btn sm", type: "button", onclick: () => save(null), disabled: !f.steps.length }, S.isNew ? "Save draft" : "Save"),
        h("button", { class: "btn sm primary", type: "button", onclick: () => save(true), disabled: !f.steps.length }, f.status === "published" ? "Save and republish" : "Publish"),
        !S.isNew && f.status === "published" ? h("button", { class: "btn sm", type: "button", onclick: unpublish }, "Unpublish") : null,
        !S.isNew ? h("button", { class: "btn sm", type: "button", onclick: cloneFlow }, "Clone") : null]);
  }
  const stageCount = () => Math.max(0, ...Object.values(levels()));
  function guard(fn) { if (!S.dirty || S.readOnly || window.confirm("Leave this flow without saving the changes?")) fn(); }
  function openDialog() {
    const groups = [["Your flows", S.flows.filter(f => f.source === "custom")], ["Built-in playbooks", S.flows.filter(f => f.source === "builtin" && !f.pack)]];
    S.packs.forEach(p => groups.push([p.name + " flows", S.flows.filter(f => f.pack === p.id)]));
    const list = h("div", { class: "list" });
    groups.forEach(([name, rows]) => { if (!rows.length) return; list.append(h("div", { class: "grp" }, name));
      rows.forEach(f => list.append(h("button", { type: "button", onclick: () => { $("#dlg").close(); guard(() => openFlow(f.id)); } },
        h("span", null, h("strong", null, f.name), h("span", { class: "xs muted", style: "display:block" }, (f.description || "").slice(0, 110))),
        h("span", { class: "xs muted" }, f.steps.length + " steps" + (f.source === "custom" ? " · " + f.status : ""))))); });
    dialog("Open a flow", list);
  }

  // ---------------------------------------------------------------- palette
  function renderPalette() {
    const q = S.q.toLowerCase();
    const match = (a) => !q || (a.name + " " + a.summary + " " + a.id + " " + (a.accelerator || "") + " " + a.category_label).toLowerCase().includes(q);
    // every agent under the kind of work it does (the blueprint's and the packs' side by side); pack agents carry the product's tag
    const packOf = (a) => S.packs.find(p => p.id === a.pack);
    const tagOf = (a) => { const p = packOf(a); return p ? (p.tag || p.name.split(/\s+/).map(w => w[0]).join("").toUpperCase().slice(0, 4)) : ""; };
    const root = clear($("#palette"));
    root.append(h("div", { class: "pal-search" }, h("input", { type: "text", placeholder: "Find an agent", value: S.q, "aria-label": "Find an agent", oninput: (e) => { S.q = e.target.value; renderPalette(); const i = $(".pal-search input"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); } })));
    const cats = new Map();   // in catalog order: the blueprint's categories first, then the ones only packs add
    S.agents.forEach(a => { if (!cats.has(a.category)) cats.set(a.category, { label: a.category_label, rows: [] }); if (match(a)) cats.get(a.category).rows.push(a); });
    let i = 0;
    cats.forEach((c, cid) => {
      if (!c.rows.length) return;
      const det = h("details", { class: "pack", open: !!q || i++ < 2 }, h("summary", null, h("span", { class: "dot", style: "background:" + catColor(cid) }), c.label, h("span", { class: "n" }, c.rows.length + " agents")));
      c.rows.forEach(a => { const p = packOf(a);
        det.append(h("button", { class: "pal-item", type: "button", draggable: "true", title: a.summary + (p ? " (" + p.name + (a.accelerator ? " · " + a.accelerator : "") + ")" : ""), disabled: S.readOnly,
          ondragstart: (e) => { e.dataTransfer.setData("text/agent", a.id); e.dataTransfer.effectAllowed = "copy"; },
          onclick: () => addStep(a.id) },
          h("span", { class: "bar", style: "background:" + catColor(a.category) }), h("span", { class: "nm" }, a.name, p && a.accelerator && a.accelerator !== p.name ? h("span", { class: "sub" }, a.accelerator) : null),
          p ? h("span", { class: "tag", title: p.name }, tagOf(a)) : h("span", { class: "plus", "aria-hidden": "true" }, "+"))); });
      root.append(det);
    });
    if (!root.querySelector(".pack")) root.append(h("p", { class: "pad muted small" }, "No agent matches “" + S.q + "”."));
  }
  stage.addEventListener("dragover", (e) => { if (!S.readOnly) e.preventDefault(); });
  stage.addEventListener("drop", (e) => { const id = e.dataTransfer.getData("text/agent"); if (!id || S.readOnly) return; e.preventDefault(); const p = toWorld(e.clientX, e.clientY); addStep(id, { x: p.x - NODE_W / 2, y: p.y - 30 }); });

  // ---------------------------------------------------------------- editing the flow
  function addStep(agentId, at) {
    if (S.readOnly) return toast("This flow is read-only: clone it to change it");

          ro ? null : h("button", { class: "btn sm ghost", type: "button", title: "Remove input", onclick: () => { f.inputs.splice(i, 1); S.dirty = true; renderInspector(); } }, "✕")))))) : h("p", { class: "small muted" }, "None."),
      h("hr"), h("details", null, h("summary", { class: "small", style: "cursor:pointer;font-weight:600" }, "Price and routing"),
        h("div", { style: "margin-top:10px" }, h("label", { class: "f" }, "Monthly", priceInput("monthly", "default")), h("label", { class: "f" }, "Runs included", priceInput("included_runs", "default")), h("label", { class: "f" }, "Per extra run", priceInput("per_run", "default")),
          h("label", { class: "f" }, "Phrases that route a goal to this flow", h("input", { type: "text", value: (f.triggers || []).join(", "), disabled: ro, placeholder: "launch kit, product launch", oninput: (e) => { f.triggers = e.target.value.split(",").map(x => x.trim()).filter(Boolean); S.dirty = true; } })))),
      h("hr"), h("p", { class: "xs muted" }, "Publishing lists the flow for rent and gives it one tool (run_flow_<id>), one endpoint (POST /flows/<id>/run) and one A2A skill. Select a step to set what it does; select a connection to remove it."),
      !S.isNew && !ro ? h("div", { class: "row", style: "margin-top:10px" }, h("a", { class: "btn sm ghost", href: BASE + "/shop/flows/" + f.id, target: "_blank", rel: "noopener" }, "Storefront page"),
        h("button", { class: "btn sm danger right", type: "button", onclick: deleteFlow }, "Delete flow")) : null);
  }

  // ---------------------------------------------------------------- check, save, publish, test
  function payload() {
    const f = S.flow, body = { id: f.id.trim(), name: f.name.trim(), description: f.description || "", triggers: f.triggers || [], layout: {},
      inputs: f.inputs.filter(i => i.name).map(i => ({ name: i.name, description: i.description || "", required: !!i.required, example: i.example || "" })),
      steps: ordered().map(s => ({ id: s.id, agent: s.agent, purpose: s.purpose || "", inputs: s.inputs || {}, needs: s.needs.filter(n => step(n)) })) };
    body.steps.forEach(s => { const p = pos(s.id); body.layout[s.id] = { x: Math.round(p.x), y: Math.round(p.y) }; });
    if (f.price && Object.values(f.price).some(v => v !== null && v !== "")) body.price = f.price;
    return body;
  }
  async function check() {
    const body = payload(); if (!body.id) body.id = "draft_flow"; if (!body.name) body.name = "Draft";
    try { S.problems = await api("/shop/admin/api/flows/validate", { body }); } catch (e) { S.problems = { ok: false, problems: [e.message], stages: [] }; }
    renderProblems();
  }
  async function ensureNamed() {
    if (!S.flow.name.trim()) { const n = await ask("Name this flow", "Name", "", "What a customer will see on the storefront."); if (!n) return false; S.flow.name = n; }
    if (!S.flow.id.trim()) { const sug = S.flow.name.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").replace(/^([^a-z])/, "f_$1").slice(0, 40);
      const id = await ask("Give it an id", "Id (lowercase, underscores)", sug, "The tool becomes run_flow_<id>. It cannot be changed later."); if (!id) return false; S.flow.id = id; }
    return true;
  }
  async function save(publish) {
    if (S.readOnly) return false;
    if (!(await ensureNamed())) { renderAll(); return false; }
    const body = payload();
    try {
      const saved = await api("/shop/admin/api/flows/" + encodeURIComponent(body.id) + (publish ? "?publish=true" : ""), { method: "PUT", body });
      await refreshFlows(); const keepTest = S.test, sel = S.sel; openFlow(saved.id); S.test = keepTest; S.sel = sel && sel.type === "node" && step(sel.id) ? sel : null; renderAll();
      toast(publish ? "Published: run_flow_" + saved.id + " is live" : "Saved as " + saved.status + " (v" + saved.version + ")"); return true;
    } catch (e) { S.problems = { ok: false, problems: String(e.message).replace(/^flow has problems: /, "").split("; "), stages: [] }; renderAll(); return false; }
  }
  async function unpublish() { try { await api("/shop/admin/api/flows/" + encodeURIComponent(S.flow.id) + "/unpublish", { method: "POST" }); await refreshFlows(); openFlow(S.flow.id); toast("Unpublished: the tool and the listing are gone"); } catch (e) { toast(e.message, 6000); } }
  async function cloneFlow() {
    const id = await ask("Clone this flow", "Id for the copy (lowercase, underscores)", (S.flow.id || "flow") + "_v2", "The copy opens as a draft you can change.");
    if (!id) return;
    try { const layout = S.flow.layout; const c = await api("/shop/admin/api/flows/" + encodeURIComponent(S.flow.id) + "/clone", { body: { new_id: id, name: S.flow.name + " (copy)" } }); await refreshFlows(); openFlow(c.id); S.flow.layout = Object.assign({}, layout, S.flow.layout); renderAll(); toast("Cloned as a draft"); }
    catch (e) { toast(e.message, 6000); }
  }
  async function deleteFlow() {
    if (!window.confirm("Delete “" + S.flow.name + "”? Customers renting it lose it and its tool disappears.")) return;
    try { await api("/shop/admin/api/flows/" + encodeURIComponent(S.flow.id), { method: "DELETE" }); await refreshFlows(); newFlow(); toast("Deleted"); } catch (e) { toast(e.message, 6000); }
  }
  async function testRun() {
    if (S.test && S.test.running) return;
    if (!S.readOnly && (S.dirty || S.isNew)) { if (!(await save(null))) return; }
    S.test = { running: true }; renderBar();
    // the server answers within a couple of seconds and runs the test on its worker pool; the page follows the run,
    // lighting each step as it finishes, so a 50-step flow never hits a proxy timeout
    const flowId = S.flow.id, here = () => S.flow && S.flow.id === flowId && S.test && S.test.running;
    try {
      let v = await api("/shop/admin/api/flows/" + encodeURIComponent(flowId) + "/test", { method: "POST", body: { wait_s: 2 } });
      while (v && v.run_id && !v.settled && v.status !== "stalled" && here()) {
        S.test = Object.assign(testCounts(v), v, { running: true }); renderAll();
        await new Promise((r) => setTimeout(r, 1500));
        v = await api("/runs/" + encodeURIComponent(v.run_id));
      }
      if (!here()) return;   // another flow was opened meanwhile
      S.test = Object.assign(testCounts(v), v);
      toast(v.status === "stalled" ? "The test run stopped mid-way (the server restarted)" :
        v.status === "awaiting_approval" ? S.test.passed + " of " + S.test.total + " steps passed; an action is waiting for approval" :
        S.test.passed + " of " + S.test.total + " steps passed", 6000);
    }
    catch (e) { if (here()) { S.test = null; toast("Test run failed: " + e.message, 6000); } }
    renderAll();
  }
  function testCounts(v) { const st = v.steps || []; return { passed: st.filter((s) => s.status === "ok" || s.status === "degraded").length, total: st.length }; }
  function renderAll() { renderBar(); renderCanvas(); renderInspector(); renderPalette(); applyView(); }
  window.addEventListener("beforeunload", (e) => { if (S.dirty && !S.readOnly) { e.preventDefault(); e.returnValue = ""; } });
  window.addEventListener("resize", () => drawWires());

  if (!getTok() && location.hostname !== "127.0.0.1" && location.hostname !== "localhost") gate(); else load();
})();
</script>
