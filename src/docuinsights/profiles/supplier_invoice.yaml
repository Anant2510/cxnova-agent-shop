# Supplier invoice check: an invoice set against its purchase order and the proof that the goods arrived, before it is paid.
#
# The same engine as every other profile: only this file differs. Every organisation that buys anything runs this
# check, which makes it the plainest way to see what the accelerator does.
#
# The tolerances are ILLUSTRATIVE. The organisation's own payment policy replaces them.
id: supplier_invoice
name: Supplier invoice check
order: 10
sector: Finance operations
plain: Before an invoice is paid, check it against the purchase order and the proof that the goods arrived.
version: "1.0"
description: A supplier invoice checked against its purchase order and proof of receipt before payment (a three-way match), with a memory of invoices already seen.

brand:
  workspace: Supplier Invoice Workbench
  client_label: ""
  case_noun: invoice case

case:
  reference_label: Invoice case reference
  reference_example: AP-2026-004412
  fields:
    - {id: claim_type, name: Request, type: text, default: Payment of a supplier invoice}
    - {id: received_date, name: Invoice received, type: date}

document_types:
  - id: purchase_order
    name: Purchase order
    group: order
    signals: [purchase order, po number, order date, ordered by, order total, quantity ordered, deliver to]
    fields:
      - {id: po_number, name: PO number, type: ref, labels: [PO Number], required: true}
      - {id: order_date, name: Order date, type: date, labels: [Order Date], required: true}
      - {id: buyer, name: Buyer, type: party, labels: [Buyer], required: true}
      - {id: supplier, name: Supplier, type: party, labels: [Supplier], required: true}
      - {id: description, name: Goods ordered, type: text, labels: [Goods Ordered]}
      - {id: quantity, name: Quantity ordered, type: number, labels: [Quantity Ordered], required: true}
      - {id: unit_price, name: Unit price, type: money, labels: [Unit Price]}
      - {id: order_total, name: Order total, type: money, labels: [Order Total], required: true}
  - id: supplier_invoice
    name: Supplier invoice
    group: invoice
    signals: [tax invoice, invoice number, invoice date, bill to, invoice total, quantity invoiced, payment due]
    fields:
      - {id: invoice_number, name: Invoice number, type: ref, labels: [Invoice Number], required: true}
      - {id: invoice_date, name: Invoice date, type: date, labels: [Invoice Date], required: true}
      - {id: supplier, name: Supplier, type: party, labels: [Supplier], required: true}
      - {id: bill_to, name: Billed to, type: party, labels: [Bill To], required: true}
      - {id: po_reference, name: PO reference, type: ref, labels: [PO Reference]}
      - {id: description, name: Goods supplied, type: text, labels: [Goods Supplied]}
      - {id: quantity, name: Quantity invoiced, type: number, labels: [Quantity Invoiced]}
      - {id: unit_price, name: Unit price, type: money, labels: [Unit Price]}
      - {id: invoice_total, name: Invoice total, type: money, labels: [Invoice Total], required: true}
      - {id: bank_account, name: Bank account to pay, type: ref, labels: [Bank Account (IBAN), IBAN]}
  - id: goods_received_note
    name: Goods received note
    group: receipt
    signals: [goods received note, grn number, received date, received at, quantity received, condition on receipt]
    fields:
      - {id: grn_number, name: GRN number, type: ref, labels: [GRN Number], required: true}
      - {id: po_reference, name: PO reference, type: ref, labels: [PO Reference]}
      - {id: received_date, name: Received date, type: date, labels: [Received Date], required: true}
      - {id: supplier, name: Supplier, type: party, labels: [Supplier]}
      - {id: received_at, name: Received at, type: party, labels: [Received At]}
      - {id: description, name: Goods received, type: text, labels: [Goods Received]}
      - {id: quantity_received, name: Quantity received, type: number, labels: [Quantity Received], required: true}
  - id: delivery_note
    name: Delivery note
    group: receipt
    signals: [delivery note, delivery note number, delivered to, delivery date, quantity delivered, signed for by]
    fields:
      - {id: delivery_number, name: Delivery note number, type: ref, labels: [Delivery Note Number], required: true}
      - {id: po_reference, name: PO reference, type: ref, labels: [PO Reference]}
      - {id: delivery_date, name: Delivery date, type: date, labels: [Delivery Date], required: true}
      - {id: supplier, name: Supplier, type: party, labels: [Supplier]}
      - {id: delivered_to, name: Delivered to, type: party, labels: [Delivered To]}
      - {id: quantity_delivered, name: Quantity delivered, type: number, labels: [Quantity Delivered], required: true}

entities:
  parties:
    purchase_order.buyer: Buyer
    purchase_order.supplier: Supplier
    supplier_invoice.supplier: Supplier
    supplier_invoice.bill_to: Buyer
    goods_received_note.supplier: Supplier
    goods_received_note.received_at: Buyer
    delivery_note.supplier: Supplier
    delivery_note.delivered_to: Buyer
  goods:
    - purchase_order.description
    - supplier_invoice.description
    - goods_received_note.description
  references:
    Purchase order: [purchase_order.po_number, supplier_invoice.po_reference, goods_received_note.po_reference, delivery_note.po_reference]
    Invoice: [supplier_invoice.invoice_number]
    Receipt: [goods_received_note.grn_number, delivery_note.delivery_number]
    Bank account: [supplier_invoice.bank_account]

# What the workspace's memory is asked to watch for: an invoice number another case already quotes goes to a person.
memory:
  duplicates: [Invoice]

synonyms:
  party: {}

evidence:
  - {id: order, title: Purchase order, any_of: [purchase_order], required: always}
  - {id: invoice, title: Supplier invoice, any_of: [supplier_invoice], required: always}
  - {id: receipt, title: Proof of receipt, any_of: [goods_received_note, delivery_note], required: always, note: A goods received note or a signed delivery note}

rules:
  - id: invoice_within_order
    family: value
    title: Invoice total does not exceed the order
    type: amount_limit
    amount: supplier_invoice.invoice_total
    limit: purchase_order.order_total
    tolerance_pct: 2
    version: "1.0"
    note: Illustrative 2 percent tolerance over the order total.
  - id: ordered_before_invoiced
    family: timing
    title: The order precedes the invoice
    type: date_order
    first: purchase_order.order_date
    then: supplier_invoice.invoice_date
    version: "1.0"
  - id: presented_in_time
    family: timing
    title: Invoice presented within the permitted period
    type: date_interval
    from: supplier_invoice.invoice_date
    to: case.received_date
    max_days: 90
    version: "1.0"
    note: Illustrative 90 days from the invoice date to its receipt.

consistency:
  - {id: supplier, family: parties, title: The same supplier on every document, kind: party, severity: high,
     fields: [purchase_order.supplier, supplier_invoice.supplier, goods_received_note.supplier, delivery_note.supplier]}
  - {id: buyer, family: parties, title: Billed to the buyer who ordered, kind: party, severity: high,
     fields: [purchase_order.buyer, supplier_invoice.bill_to, goods_received_note.received_at, delivery_note.delivered_to]}
  - {id: quantity, family: goods, title: "Quantity ordered, invoiced and received agree", kind: number, tolerance_pct: 0, severity: high,
     fields: [purchase_order.quantity, supplier_invoice.quantity, goods_received_note.quantity_received, delivery_note.quantity_delivered]}
  - {id: order_reference, family: goods, title: Documents quote the same purchase order, kind: ref, severity: medium,
     fields: [purchase_order.po_number, supplier_invoice.po_reference, goods_received_note.po_reference, delivery_note.po_reference]}
  - {id: goods, family: goods, title: The goods invoiced are the goods ordered, kind: text, severity: medium,
     fields: [purchase_order.description, supplier_invoice.description, goods_received_note.description]}

# What the integrity agent is told about this use case. Each line is a deterministic check; none is a model's opinion.
integrity:
  sums:
    - {id: order_arithmetic, title: The order's quantity and unit price give its total, kind: product, parts: [purchase_order.quantity, purchase_order.unit_price], equals: purchase_order.order_total}
    - {id: invoice_arithmetic, title: The invoice's quantity and unit price give its total, kind: product, parts: [supplier_invoice.quantity, supplier_invoice.unit_price], equals: supplier_invoice.invoice_total}
  identifiers:
    - {id: bank_account_check, title: The bank account number passes its check digits, field: supplier_invoice.bank_account, check: iban}
  issued: [purchase_order.order_date, supplier_invoice.invoice_date, goods_received_note.received_date, delivery_note.delivery_date]
  stable:
    - {id: bank_details, title: The supplier is paid into the account it used before, role: Supplier, reference: Bank account,
       advice: "Confirm the change with the supplier on a telephone number you already hold, before any payment."}

# Every party is screened against the watchlists (the default). The service target is ILLUSTRATIVE.
service:
  target_days: 5
  clock: working
  starts: case.received_date
  value: supplier_invoice.invoice_total
  high_value: 25000
  note: Illustrative. Five working days from receipt of the invoice; an invoice of 25,000 or more is high value.

outcomes:
  proceed: {label: Ready to pay, description: "The order, the invoice and the receipt agree, and the invoice has not been seen before."}
  request_evidence: {label: Request missing document, description: "The order, the invoice or the proof of receipt is missing."}
  review: {label: Hold for review, description: "The documents disagree, a limit is exceeded, or the invoice is already known: a person must decide before payment."}

correspondence:
  evidence_request:
    subject: "{reference}: we cannot release payment yet"
    opening: "Thank you for the invoice under {reference}. We have checked it against the order and the receipt and cannot release payment yet."
    closing: "Please reply quoting {reference}. The check resumes as soon as we hear from you."
  decision_note:
    subject: "{reference}: outcome of the invoice check"
    opening: "We have completed the check of {case_noun} {reference}."
    closing: "This note records the documents and rules the outcome rests on."

counterfactuals:
  - id: invoice_matches_order
    title: Bring the invoice total back to the order total
    expect: Clears the over-billing; the quantity mismatch remains.
    change: {op: set_field, field: supplier_invoice.invoice_total, value: "@purchase_order.order_total"}
  - id: full_receipt
    title: Receive the full quantity
    expect: The receipt then agrees with the order.
    change: {op: set_field, field: goods_received_note.quantity_received, value: "@purchase_order.quantity"}
  - id: late_presentation
    title: Present the invoice four months later
    expect: The presentation rule fails.
    change: {op: set_case, field: received_date, value: "2027-02-20"}
    ask: date

samples:
  - id: clean
    title: Clean three-way match
    story: "The order, the invoice and the goods received note agree on supplier, quantity and amount."
    path: supplier_invoice
    case: {reference: AP-2026-004412, received_date: "2026-10-22"}
    documents:
      - {file: purchase_order.pdf, category: purchase_order}
      - {file: invoice.pdf, category: supplier_invoice}
      - {file: goods_received_note.pdf, category: goods_received_note}
  - id: mismatch
    title: Over-billed and short-received
    story: "The invoice bills more units than were ordered and exceeds the order total, and the warehouse received fewer still."
    path: supplier_invoice
    case: {reference: AP-2026-004431, received_date: "2026-11-04"}
    documents:
      - {file: purchase_order_b.pdf, category: purchase_order}
      - {file: invoice_over.pdf, category: supplier_invoice}
      - {file: goods_received_note_short.pdf, category: goods_received_note}
  - id: payment_change
    title: New bank details and a total that does not add up
    story: "The invoice is within tolerance of its order, so the three-way match passes. But its quantity and unit price do not give its total, and it asks to be paid into an account this supplier has not used before (load 'Clean three-way match' first to see that)."
    path: supplier_invoice
    case: {reference: AP-2026-004702, received_date: "2026-11-19"}
    documents:
      - {file: purchase_order_c.pdf, category: purchase_order}
      - {file: invoice_new_account.pdf, category: supplier_invoice}
      - {file: goods_received_note_c.pdf, category: goods_received_note}
  - id: duplicate
    title: "The same invoice, submitted again"
    story: "Load 'Clean three-way match' first. This case presents the same invoice under a new reference: the documents agree with each other, and the workspace's memory recognises the invoice."
    path: supplier_invoice
    case: {reference: AP-2026-004587, received_date: "2026-11-18"}
    documents:
      - {file: purchase_order.pdf, category: purchase_order}
      - {file: invoice.pdf, category: supplier_invoice}
      - {file: delivery_note.pdf, category: delivery_note}
